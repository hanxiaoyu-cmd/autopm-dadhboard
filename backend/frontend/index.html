/* ===== GANTT CHART TAB ===== */
function pdGanttTab(p,tasks){
  if(!tasks || !tasks.length) return `<div style="padding:40px;text-align:center;color:var(--t3)">No tasks to display in Gantt chart.</div>`;

  // Compute date range: project start → targetLaunch, with task padding
  const pStart=new Date(p.start+'T00:00:00');
  const pEnd=new Date(p.targetLaunch+'T00:00:00');
  // Expand range by 15 days each side
  const rangeStart=new Date(pStart); rangeStart.setDate(rangeStart.getDate()-15);
  const rangeEnd=new Date(pEnd); rangeEnd.setDate(rangeEnd.getDate()+30);
  const totalDays=Math.max(1,(rangeEnd-rangeStart)/(86400000));

  // Today marker
  const today=new Date(); const todayPct=Math.max(0,Math.min(100,(today-rangeStart)/86400000/totalDays*100));

  // Build month headers
  const months=[];
  const cur=new Date(rangeStart.getFullYear(),rangeStart.getMonth(),1);
  while(cur<=rangeEnd){
    const msStart=new Date(cur);
    const msEnd=new Date(cur.getFullYear(),cur.getMonth()+1,0);
    const leftPct=(msStart-rangeStart)/86400000/totalDays*100;
    const widthPct=(msEnd-msStart+86400000)/86400000/totalDays*100;
    months.push({label:cur.toLocaleString('en',{month:'short',year:'2-digit'}),leftPct,widthPct});
    cur.setMonth(cur.getMonth()+1);
  }

  // Task rows
  const getTaskPos=task=>{
    const s=new Date((task.start||p.start)+'T00:00:00');
    const d=new Date((task.dueDate||task.due||p.targetLaunch)+'T00:00:00');
    const left=Math.max(0,(s-rangeStart)/86400000/totalDays*100);
    const w=Math.max(1,(d-s)/86400000/totalDays*100);
    return {left,width:w};
  };
  const statusClass=t=>{
    if(t.status==='Done'||t.prog>=100)return'done';
    if(t.status==='In Progress'||t.status==='IP')return'ip';
    if(t.status==='At Risk')return'risk';
    if(t.status==='Delayed'||t.status==='Blocked')return t.status==='Delayed'?'delay':'blocked';
    return'ns';
  };

  let h=`<div class="pd-gantt-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span class="fw6" style="font-size:14px">Gantt Chart — ${p.sku}</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-xs" onclick="toast('Zoom to fit coming soon')">Fit View</button>
        <button class="btn btn-primary btn-sm" onclick="showNewTaskModal('${p.id}')">+ Add Task</button>
      </div>
    </div>`;

  // Legend
  h+=`<div class="pd-gantt-legend">
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--green)"></div> Done</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--blue)"></div> In Progress</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--amber)"></div> At Risk</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--red)"></div> Delayed</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--darkred)"></div> Blocked</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--border)"></div> Not Started</div>
  </div>`;

  h+=`<div class="pd-gantt-chart">`;

  // Header
  h+=`<div class="pd-gantt-header">
    <div class="pd-gantt-h-label">Task Name</div>
    <div class="pd-gantt-h-months">${months.map(m=>`<div class="pd-gantt-h-month" style="left:${m.leftPct}%;width:${m.widthPct}%">${m.label}</div>`).join('')}</div>
  </div>`;

  // Grid: add vertical grid lines
  h+=`<div style="position:relative">`;
  months.forEach(m=>{
    h+=`<div class="pd-gantt-gridline" style="left:${m.leftPct}%"></div>`;
  });

  // Today marker
  h+=`<div class="pd-gantt-today" style="left:${todayPct}%"><div class="pd-gantt-today-label">TODAY</div></div>`;

  // Task rows
  tasks.forEach(t=>{
    const pos=getTaskPos(t);
    const cls=statusClass(t);
    const prog=Math.max(0,Math.min(100,t.prog||0));
    h+=`<div class="pd-gantt-row">
      <div class="pd-gantt-task-name" title="${t.name}">${t.name}</div>
      <div class="pd-gantt-timeline">
        <div class="pd-gantt-bar ${cls}" style="left:${pos.left}%;width:${pos.width}%" title="${t.name}: ${fmtShort(t.start)} → ${fmtShort(t.dueDate||t.due)} (${prog}%)">
          <span style="font-size:9px;opacity:.9">${prog}%</span>
        </div>
      </div>
    </div>`;
  });

  h+=`</div></div></div>`;
  return h;
}

/* AI content generators */
function dccGenBottleneck(dept, deptTasks, deptProjects){
  const delayed = deptTasks.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const overloaded = {};
  deptTasks.filter(t=>t.status!=='Done'&&t.status!=='Completed').forEach(t=>{
    if(!overloaded[t.owner]) overloaded[t.owner]={count:0,critical:0,projects:new Set()};
    overloaded[t.owner].count++;
    if(t.pri==='high') overloaded[t.owner].critical++;
    if(t.projectId) overloaded[t.owner].projects.add(t.projectId);
  });
  const topOverloaded = Object.entries(overloaded).sort((a,b)=>b[1].count-a[1].count)[0];
  const topDelayed = deptProjects.filter(p=>p.delayDays>0).sort((a,b)=>b.delayDays-a.delayDays)[0];
  const gateRisks = {};
  deptTasks.filter(t=>t.status==='Delayed'||t.status==='Blocked').forEach(t=>{
    const g = NPI_GATES[t.gate]?.name||'Unknown';
    if(!gateRisks[g]) gateRisks[g]=0;
    gateRisks[g]++;
  });
  const topGate = Object.entries(gateRisks).sort((a,b)=>b[1]-a[1])[0];

  let html = '<div style="margin-top:6px">';
  if(topDelayed) html += '<div><strong>Project Bottleneck:</strong> <span class="hi-red">'+topDelayed.sku+'</span> — '+topDelayed.keyIssue+' (+'+topDelayed.delayDays+'d delay). '+topDelayed.recoveryAction+'</div>';
  if(topOverloaded && topOverloaded[1].count>2) html += '<div style="margin-top:4px"><strong>Resource Bottleneck:</strong> <span class="hi-amber">'+topOverloaded[0]+'</span> has '+topOverloaded[1].count+' open tasks ('+topOverloaded[1].critical+' critical) across '+topOverloaded[1].projects.size+' projects.</div>';
  if(topGate) html += '<div style="margin-top:4px"><strong>Gate Risk:</strong> <span class="hi-red">'+topGate[0]+'</span> has '+topGate[1]+' delayed/blocked tasks — highest risk gate for '+dept+'.</div>';
  if(!topDelayed && (!topOverloaded||topOverloaded[1].count<=2)) html += '<div><span class="hi-green">No critical bottlenecks detected.</span> Department operating within normal parameters.</div>';
  html += '</div>';
  return html;
}

function dccGenPriority(dept, deptTasks){
  const active = deptTasks.filter(t=>t.status!=='Done'&&t.status!=='Completed');
  const prioritized = active.sort((a,b)=>{
    const priScore = {high:0,medium:1,low:2};
    const stScore = {'Blocked':0,'Delayed':1,'At Risk':2,'In Progress':3,'Not Started':4};
    return (priScore[a.pri]||2)-(priScore[b.pri]||2) || (stScore[a.status]||4)-(stScore[b.status]||4) || (b.delayDays||0)-(a.delayDays||0);
  }).slice(0,5);
  if(!prioritized.length) return '<div><span class="hi-green">All tasks completed. No immediate priorities.</span></div>';
  let html = '';
  prioritized.forEach((t,i)=>{
    const p = S.projects.find(x=>x.id===t.projectId);
    html += '<div style="margin-top:4px;padding:4px 8px;background:rgba(139,92,246,0.05);border-radius:4px;border-left:2px solid '+(i===0?'#ef4444':i<3?'#f59e0b':'#6b7280')+'">';
    html += '<strong>#'+(i+1)+'</strong> '+(p?p.sku+' — ':'')+t.name;
    html += ' <span style="font-size:9px;color:#94a3b8">('+(t.status)+', '+(t.pri)+' priority'+(t.delayDays>0?', +'+t.delayDays+'d delay':'')+')</span>';
    if(t.recoveryAction) html += '<div style="font-size:10px;color:#94a3b8;margin-top:1px">Action: '+t.recoveryAction+'</div>';
    html += '</div>';
  });
  return html;
}

function dccGenForecast(dept, deptTasks, deptProjects){
  const delayed = deptTasks.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const atRisk = deptTasks.filter(t=>t.status==='At Risk');
  const highRiskProjs = deptProjects.filter(p=>p.riskLevel==='High');
  let html = '<div>';
  if(delayed.length) html += '<div><span class="hi-red">'+delayed.length+' delayed/blocked tasks</span> — if unresolved, launch delays of <strong>'+Math.max(...delayed.map(t=>t.delayDays||0),0)+'+ days</strong> possible.</div>';
  if(atRisk.length) html += '<div style="margin-top:4px"><span class="hi-amber">'+atRisk.length+' tasks at risk</span> — may escalate to delayed in next 1-2 weeks.</div>';
  if(highRiskProjs.length) html += '<div style="margin-top:4px"><strong>High-risk projects:</strong> '+highRiskProjs.map(p=>'<span class="hi-red">'+p.sku+'</span>').join(', ')+' — require management attention.</div>';
  const next2w = deptTasks.filter(t=>t.dueDate&&t.status!=='Done'&&new Date(t.dueDate+'T00:00:00')<=new Date(Date.now()+14*86400000));
  if(next2w.length) html += '<div style="margin-top:4px"><strong>Next 2 weeks:</strong> '+next2w.length+' tasks due — '+next2w.filter(t=>t.pri==='high').length+' are high priority.</div>';
  if(!delayed.length&&!atRisk.length) html += '<span class="hi-green">No significant risks forecasted for next 2-4 weeks.</span>';
  html += '</div>';
  return html;
}

function dccGenEscalation(dept, deptTasks, deptProjects){
  const escalated = deptTasks.filter(t=>t.escalation);
  const esclist = DCC_ESCALATIONS[dept]||[];
  if(!escalated.length && !esclist.length) return '<div><span class="hi-green">No escalations needed at this time.</span></div>';
  let html = '';
  escalated.forEach(t=>{
    const p = S.projects.find(x=>x.id===t.projectId);
    html += '<div style="margin-top:4px;padding:6px 10px;background:rgba(239,68,68,0.06);border-radius:4px;border-left:3px solid #ef4444">';
    html += '<strong>'+(p?p.sku:'—')+'</strong>: '+t.name;
    html += '<div style="font-size:10px;color:#94a3b8;margin-top:2px">Recovery: '+t.recoveryAction+' | Owner: '+t.recoveryOwner+'</div>';
    html += '</div>';
  });
  esclist.forEach(e=>{
    html += '<div style="margin-top:4px;padding:6px 10px;background:rgba(239,68,68,0.06);border-radius:4px;border-left:3px solid #ef4444">';
    html += '<strong>Decision needed:</strong> '+e.decision;
    html += '<div style="font-size:10px;color:#94a3b8;margin-top:2px">Project: '+e.project+' | By: '+e.neededBy+' | Impact: '+e.impact+'</div>';
    html += '</div>';
  });
  return html;
}

function dccGenResource(dept, deptTasks, deptUsers){
  const overloaded = [];
  deptUsers.forEach(u=>{
    const ut = deptTasks.filter(t=>t.owner===u.name&&t.status!=='Done'&&t.status!=='Completed');
    const crit = ut.filter(t=>t.pri==='high').length;
    const overdue = ut.filter(t=>isOverdue(t.dueDate,t.status)).length;
    const projs = [...new Set(ut.map(t=>t.projectId))].length;
    if(ut.length>2 || crit>0 || overdue>0){
      overloaded.push({name:u.name,open:ut.length,critical:crit,overdue,projects:projs});
    }
  });
  const noOwner = deptTasks.filter(t=>(!t.owner||t.owner==='Unassigned')&&t.status!=='Done'&&t.status!=='Completed');
  let html = '<div>';
  if(overloaded.length){
    html += '<div style="margin-top:4px"><strong>Overloaded resources:</strong></div>';
    overloaded.forEach(o=>{
      html += '<div style="margin-top:2px;padding:2px 6px;background:rgba(245,158,11,0.05);border-radius:3px"><span class="hi-amber">'+o.name+'</span>: '+o.open+' open ('+o.critical+' critical, '+o.overdue+' overdue) across '+o.projects+' projects</div>';
    });
  }
  if(noOwner.length) html += '<div style="margin-top:4px"><span class="hi-red">'+noOwner.length+' tasks have no owner assigned.</span></div>';
  const competing = {};
  deptTasks.filter(t=>t.owner&&t.status!=='Done').forEach(t=>{
    if(!competing[t.owner]) competing[t.owner]=new Set();
    competing[t.owner].add(t.projectId);
  });
  const conflicts = Object.entries(competing).filter(([k,v])=>v.size>1);
  if(conflicts.length) html += '<div style="margin-top:4px"><strong>Resource conflicts:</strong> '+conflicts.map(([n,ps])=>n+' ('+ps.size+' projects)').join(', ')+'</div>';
  if(!overloaded.length&&!noOwner.length&&!conflicts.length) html += '<span class="hi-green">Resources are balanced. No rebalancing needed.</span>';
  html += '</div>';
  return html;
}

function renderDeptView(dept){
  const deptTasks=S.tasks.filter(t=>t.department===dept);

  const openT=deptTasks.filter(t=>t.status!=='Done'&&t.status!=='Completed');
  const overdueT=deptTasks.filter(t=>isOverdue(t.dueDate,t.status));

  const riskProjects=deptProjects.filter(p=>p.riskLevel==='High');
  const leader=DCC_LEADERS[dept]||{name:'--',role:'--'};
  const ownerWL={};
  deptUsers.forEach(u=>{
    const ut=deptTasks.filter(t=>t.owner===u.name);
    const op=ut.filter(t=>t.status!=='Done'&&t.status!=='Completed');

  });
  const healthScore=deptProjects.length?Math.round((deptProjects.filter(p=>p.riskLevel==='Low').length/deptProjects.length)*100):100;

  h+='<div class="dcc-h-stat"><div class="dcc-h-stat-val '+(riskProjects.length?'red':'green')+'">'+riskProjects.length+'</div><div class="dcc-h-stat-lbl">At Risk</div></div>';
  h+='<div class="dcc-h-stat"><div class="dcc-h-stat-val '+(Object.values(ownerWL).filter(o=>o.capStatus!=='ok').length?'red':'green')+'">'+Object.values(ownerWL).filter(o=>o.capStatus!=='ok').length+'</div><div class="dcc-h-stat-lbl">Overloaded</div></div>';

      h+='<div style="font-size:11px;color:var(--green);margin-bottom:4px"><strong>Solution:</strong> '+k.solution+'</div>';
      h+='<div style="font-size:10px;color:var(--t3)"><strong>Prevention:</strong> '+k.prevention+'</div>';
      if(k.tags&&k.tags.length) h+='<div style="margin-top:6px">'+k.tags.map(t=>'<span style="font-size:9px;padding:2px 6px;background:rgba(59,130,246,0.1);color:#60a5fa;border-radius:3px;margin-right:4px">'+t+'</span>').join('')+'</div>';

  h+='</div></div>';

  // === 5. AI DEPARTMENT ASSISTANT ===
  h+='<div class="dcc-ai-card"><div class="dcc-ai-title">🤖 AI Assistant — '+dept+'</div><div class="dcc-ai-text">';
  h+='<div>'+dept+' has <strong>'+openT.length+' open tasks</strong>, <strong style="color:'+(overdueT.length?'#ef4444':'inherit')+'">'+overdueT.length+' overdue</strong>, <strong style="color:'+(delayedT.length?'#f59e0b':'inherit')+'">'+delayedT.length+' delayed</strong>. ';
  h+=riskProjects.length?'<span class="hi-red">'+riskProjects.length+' project(s) need attention.</span>':'<span class="hi-green">All projects on track.</span>';
  h+='</div>';
  h+=dccGenBottleneck(dept, deptTasks, deptProjects);
  h+='</div><div class="dcc-ai-actions">';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'summary\',\''+dept+'\')">Summary</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'bottleneck\',\''+dept+'\')">Bottlenecks</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'priority\',\''+dept+'\')">Top Priorities</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'resource\',\''+dept+'\')">Resource Rebalance</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'escalation\',\''+dept+'\')">Escalation Draft</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'forecast\',\''+dept+'\')">Forecast</button>';
  h+='</div><div class="dcc-ai-result" id="dcc-ai-dept"></div></div>';
  h+='</div>';
  return h;
}

function dccShowAI(btn, type, dept){
  const resultEl=btn.closest('.dcc-ai-card').querySelector('.dcc-ai-result');
  if(resultEl.classList.contains('show')&&resultEl.dataset.type===type){resultEl.classList.remove('show');return;}
  let html='';
  const dt=S.tasks.filter(t=>t.department===dept);
  const dp=S.projects.filter(p=>dt.some(t=>t.projectId===p.id));
  if(type==='summary'){
    html+='<strong>'+dept+' Department Summary</strong>';
    html+='<div style="margin-top:4px">'+dept+' supports '+dp.length+' projects with '+dt.filter(t=>t.status!=='Done').length+' open tasks. '+dt.filter(t=>isOverdue(t.dueDate,t.status)).length+' overdue, '+dt.filter(t=>t.status==='Delayed'||t.status==='Blocked').length+' delayed. '+(dp.filter(p=>p.riskLevel==='High').length?'<span class="hi-red">'+dp.filter(p=>p.riskLevel==='High').length+' high-risk projects.</span>':'<span class="hi-green">No high-risk projects.</span>')+'</div>';
  } else if(type==='bottleneck'){
    html+='<strong>Bottleneck Detection — '+dept+'</strong>';
    html+=dccGenBottleneck(dept, dt, dp);
  } else if(type==='priority'){
    html+='<strong>Top Priorities — '+dept+'</strong>';
    html+=dccGenPriority(dept, dt);
  } else if(type==='resource'){
    html+='<strong>Resource Rebalance — '+dept+'</strong>';
    html+=dccGenResource(dept, dt, S.users.filter(u=>u.dept===dept));
  } else if(type==='escalation'){
    html+='<strong>Escalation Draft — '+dept+'</strong>';
    html+=dccGenEscalation(dept, dt, dp);
  } else if(type==='forecast'){
    html+='<strong>Forecast — '+dept+'</strong>';
    html+=dccGenForecast(dept, dt, dp);
  }
  resultEl.innerHTML=html;
  resultEl.classList.add('show');
  resultEl.dataset.type=type;
}

/* Keep REAL_DEPT_STATS for Portfolio View */


/* ===== APP INIT ===== */
const APP_VERSION = '20.0';

function seedData(){
  // Generate demo projects
  const brands = ['Ninja','Shark'];
  const categories = ['Motorized','Heated Indoor','Personal Care','Coffee','Corded Stick','Robot Vacuum','Air Purifier','Handheld'];
  const types = ['Extension','NPD CAT A','NPD CAT B','NPD CAT C','Cost Down','Sourcing'];
  const phases = ['Kickoff','ECN OPEN','ECN DD','EB Build','Sample & Test','ECN IMP','MP'];
  const depts = DEPARTMENTS;
  const statuses = ['Not Started','In Progress','At Risk','Delayed','Blocked','Done'];
  const riskLevels = ['High','Medium','Low'];
  
  const projects = [];
  const tasks = [];
  const issues = [];
  const deliverables = [];
  const milestones = [];
  
  // Generate 15 projects
  for(let i=0;i<15;i++){
    const brand = brands[i%2];
    const cat = categories[i%categories.length];
    const type = types[i%types.length];
    const phase = phases[Math.min(Math.floor(i/2.5),6)];
    const healthScore = Math.max(10,Math.min(100, 85 - i*4 + Math.floor(Math.random()*20)));
    
    const pId = 'P'+(1001+i);
    const sku = brand[0]+cat[0]+type[0]+String(i+1).padStart(3,'0');
    projects.push({
      id:pId, name:sku+' '+type+' '+cat,
      brand:brand, category:cat, type:type,
      phase:phase, status:i<3?'On Track':i<7?'At Risk':'Delayed',
      healthScore:healthScore,
      startDate:'2026-0'+(1+i%3)+'-01',
      targetLaunch:'2026-0'+(7+i%4)+'-'+String(15+i%10).padStart(2,'0'),
      dept:depts[i%depts.length],
      owner:S.users[i%S.users.length].name
    });
    
    // Generate tasks per project
    const numTasks = 4 + Math.floor(Math.random()*5);
    for(let j=0;j<numTasks;j++){
      const taskDept = depts[(i+j)%depts.length];
      const taskStatus = j===0&&i>5?'Overdue':j<2?'In Progress':j<4?'At Risk':'Not Started';
      const dueDate = '2026-0'+(2+j%6)+'-'+String(10+j%20).padStart(2,'0');
      tasks.push({
        id:'T'+(1001+i*10+j),
        projectId:pId,
        name:taskDept+' Deliverable '+(j+1),
        dept:taskDept,
        owner:S.users[(i+j)%S.users.length].name,
        status:taskStatus==='Overdue'?'Delayed':taskStatus,
        priority:j<2?'High':j<4?'Medium':'Low',
        dueDate:dueDate,
        gate:phases[Math.min(j,6)]
      });
    }
    
    // Generate some issues
    if(i>2){
      issues.push({
        id:'I'+(1001+i),
        projectId:pId,
        type:i%3===0?'Blocker':i%3===1?'Delay':'Risk',
        description:type+' '+cat+' issue in '+phase,
        severity:riskLevels[i%3],
        status:'Open',
        owner:S.users[(i+1)%S.users.length].name,
        dueDate:'2026-0'+(3+i%4)+'-01'
      });
    }
    
    // Generate milestones
    for(let j=0;j<3;j++){
      milestones.push({
        id:'M'+(1001+i*3+j),
        projectId:pId,
        name:phases[(j*2)%7]+' Gate',
        date:'2026-0'+(2+j*2)+'-'+String(15+j*5).padStart(2,'0'),
        status:j===0?'Completed':'Upcoming'
      });
    }
  }
  
  S.projects=projects;
  S.tasks=tasks;
  S.issues=issues;
  S.deliverables=deliverables;
  S.milestones=milestones;
  S.knowledge=[];
  S.aiHistory=[];
  S._v=DATA_VERSION;
  saveData();
}

function initApp(){
  if(!loadData()){
    seedData();
  }
  render();
  // Update version display
  const sv=document.getElementById('sidebarVersion');
  if(sv) sv.textContent='v'+APP_VERSION;
}

/* ===== UI UTILITIES ===== */
function toggleAI(){
  const p=document.getElementById('aiPanel');
  if(p) p.classList.toggle('open');
}

function toggleSidebar(){
  document.body.classList.toggle('sidebar-collapsed');
}

function toggleUserMenu(){
  const d=document.getElementById('userDropdown');
  if(d) d.classList.toggle('show');
}

function handleGlobalSearch(ev){
  if(ev.key==='Enter'){
    const q=ev.target.value.trim().toLowerCase();
    if(!q) return;
    // Search projects
    const found=S.projects.find(p=>p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q));
    if(found){
      navigateTo('projects',{projectId:found.id});
    } else {
      toast('No results for: '+q);
    }
  }
}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='autopm-data-v'+APP_VERSION+'.json';
  a.click();
  toast('Data exported successfully');
}

function importData(ev){
  const file=ev.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      Object.assign(S,data);
      saveData();
      render();
      toast('Data imported successfully');
    }catch(err){
      toast('Import failed: invalid file format');
    }
  };
  reader.readAsText(file);
}

// Close dropdown on outside click
document.addEventListener('click',function(e){
  const dd=document.getElementById('userDropdown');
  if(dd && !e.target.closest('.user-info') && !e.target.closest('.user-dropdown')){
    dd.classList.remove('show');
  }
});

// Start app
// Global error handler for debugging
window.onerror=function(msg,url,line,col,err){
  const d=document.getElementById('content');
  if(d) d.innerHTML='<div style="padding:40px;color:#ef4444;font-family:monospace;background:#1e1e1e;margin:20px;border-radius:8px"><h2>JS Error</h2><pre>'+msg+'\nLine: '+line+'\n\n'+(err?err.stack:'')+'</pre></div>';
  console.error('Global error:',msg,line,err);
};
try{
  initApp();
}catch(e){
  document.getElementById('content').innerHTML='<div style="padding:40px;color:#ef4444;font-family:monospace;background:#1e1e1e;margin:20px;border-radius:8px"><h2>Init Error</h2><pre>'+e.message+'\n\n'+e.stack+'</pre></div>';
}

</script>
