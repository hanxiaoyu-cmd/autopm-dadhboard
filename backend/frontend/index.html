    const ms=S.milestones?.filter(m=>m.projectId===p.id).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate))[0];
    h+='<tr><td><span class="pn" onclick="navigateTo(\'projects\',{projectId:\''+p.id+'\'})">'+(p.sku||p.name||'--')+'</span></td>';
    h+='<td style="font-size:10px">'+gate+'</td>';
    h+='<td style="font-size:10px">'+((ms&&(ms.name||''))||'--')+'</td>';
    h+='<td class="num">'+pi.open+'</td>';
    h+='<td class="num" style="color:'+(pi.overdue?'#ef4444':'inherit')+'">'+pi.overdue+'</td>';
    h+='<td class="num" style="color:'+(pi.delayed?'#ef4444':'inherit')+'">'+pi.delayed+'</td>';
    h+='<td>'+(p.riskLevel==='High'?'<span class="badge br">High</span>':p.riskLevel==='Medium'?'<span class="badge ba">Med</span>':'<span class="badge bg">Low</span>')+'</td>';
    h+='<td style="font-size:10px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(p.keyIssue||'--')+'</td>';
    h+='<td style="white-space:nowrap">';
    h+='<button class="dcc-action-btn primary" onclick="navigateTo(\'projects\',{projectId:\''+p.id+'\'})">View</button> ';
    h+='<button class="dcc-action-btn" onclick="dccShowAI(this,\'bottleneck\',\''+dept+'\')">Ask AI</button> ';
    h+='<button class="dcc-action-btn" onclick="dccAddRecovery(\''+p.id+'\')">Recovery</button> ';
    h+='<button class="dcc-action-btn danger" onclick="dccShowAI(this,\'escalation\',\''+dept+'\')">Escalate</button>';
    h+='</td></tr>';
  });
  if(!projImpact.length) h+='<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--t3)">No projects involve '+deptName+' department.</td></tr>';
  h+='</tbody></table></div></div>';
  
  // ========================================
  // MODULE 3: RISK / DELAY / BLOCKER / ACTION
  // ========================================
  const riskItems=deptTasks.filter(t=>t.status==='Delayed'||t.status==='Blocked'||t.riskFlag);
  h+='<div class="dcc-section"><div class="dcc-section-hdr"><div class="dcc-section-title"><span class="ico">⚠️</span> Risks / Delays / Blockers</div><span class="dcc-section-badge '+(riskItems.length?'red':'green')+'">'+riskItems.length+' items</span></div>';
  h+='<div class="dcc-section-body">';
  if(riskItems.length){
    h+='<table class="dcc-table"><thead><tr><th>Task / Issue</th><th>Project</th><th>Root Cause</th><th>Impact</th><th>Recovery Action</th><th>Owner</th><th>Target Date</th><th>Status</th><th></th></tr></thead><tbody>';
    riskItems.forEach(t=>{
      const p=getProject(t.projectId);
      const impact=t.impact||t.impactedMs||t.blocker||t.keyIssue||'--';
      const targetDate=t.targetRecoveryDate||t.dueDate;
      const hasRecovery=!!t.recoveryAction;
      h+='<tr'+(t.status==='Blocked'?' style="background:rgba(239,68,68,0.05)"':'')+'><td style="max-width:150px"><span class="pn" onclick="showEditTaskModal(\''+t.id+'\')">'+(t.name||'').slice(0,30)+'</span></td>';
      h+='<td><span class="pn" onclick="navigateTo(\'projects\',{projectId:\''+(p?.id||'')+'\'})">'+(p?.sku||'--')+'</span></td>';
      h+='<td style="font-size:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis">'+(t.rootCause||'--')+'</td>';
      h+='<td style="font-size:10px;max-width:100px;overflow:hidden;text-overflow:ellipsis">'+impact+'</td>';
      if(hasRecovery){
        h+='<td style="font-size:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis">'+(t.recoveryAction||'').slice(0,50)+'</td>';
      } else {
        h+='<td><span class="dcc-no-recovery">NO RECOVERY PLAN</span></td>';
      }
      h+='<td>'+(t.owner||'--')+'</td>';
      h+='<td>'+fmtShort(targetDate)+'</td>';
      h+='<td><span class="badge '+(t.status==='Blocked'?'br':t.status==='Delayed'?'ba':'bb')+'">'+t.status+'</span></td>';
      h+='<td style="white-space:nowrap">';
      if(!hasRecovery){
        h+='<button class="dcc-action-btn" onclick="dccAddRecovery(\''+t.projectId+'\')">Add Recovery</button> ';
        h+='<button class="dcc-action-btn danger" onclick="dccShowAI(this,\'escalation\',\''+dept+'\')">Escalate</button> ';
        h+='<button class="dcc-action-btn" onclick="dccShowAI(this,\'similar\',\''+dept+'\')">Find Case</button>';
      } else {
        h+='<button class="dcc-action-btn" onclick="showEditTaskModal(\''+t.id+'\')">Edit</button>';
      }
      h+='</td></tr>';
    });
    h+='</tbody></table>';
  } else {
    h+='<div style="padding:20px;text-align:center;color:var(--t3)"><div style="font-size:28px;margin-bottom:8px">✅</div><div>No active risks or blockers.</div></div>';
  }
  h+='</div></div>';
  
  // ========================================
  // MODULE 4: PEOPLE & WORKLOAD
  // ========================================
  h+='<div class="dcc-section"><div class="dcc-section-hdr"><div class="dcc-section-title"><span class="ico">👥</span> People & Workload</div><span class="dcc-section-badge '+(overloadedCount?'red':highLoadCount?'orange':'green')+'">'+pressureCount+' under pressure</span></div>';
  h+='<div class="dcc-section-body">';
  h+='<table class="dcc-table"><thead><tr><th>Owner</th><th>Role</th><th style="text-align:center">Open</th><th style="text-align:center">Critical</th><th style="text-align:center">Overdue</th><th style="text-align:center">Projects</th><th>Capacity</th></tr></thead><tbody>';
  const sortedPeople=Object.entries(ownerWL).sort((a,b)=>{
    const order={overload:0,high:1,ok:2};
    return (order[a[1].capStatus]||2)-(order[b[1].capStatus]||2);
  });
  sortedPeople.forEach(([name,data])=>{
    const capLabel=data.capStatus==='overload'?'OVERLOAD':data.capStatus==='high'?'HIGH':'OK';
    h+='<tr'+(data.capStatus==='overload'?' style="background:rgba(239,68,68,0.05)"':'')+'><td><strong>'+name+'</strong></td>';
    h+='<td style="font-size:10px;color:var(--t3)">'+(data.role||'--')+'</td>';
    h+='<td class="num">'+data.open+'</td>';
    h+='<td class="num" style="color:'+(data.critical?'#ef4444':'inherit')+'">'+data.critical+'</td>';
    h+='<td class="num" style="color:'+(data.overdue?'#ef4444':'inherit')+'">'+data.overdue+'</td>';
    h+='<td class="num">'+data.projects+'</td>';
    h+='<td><span class="dcc-wl-cap '+data.capStatus+'">'+capLabel+'</span></td></tr>';
  });
  if(!sortedPeople.length) h+='<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--t3)">No team members assigned to '+deptName+'.</td></tr>';
  h+='</tbody></table></div></div>';
  
  // ========================================
  // MODULE 5: DEPARTMENT MANAGEMENT HUB
  // ========================================
  // Count items per folder from knowledge data
  const deptKB=S.knowledge.filter(k=>k.relatedFunction===dept||k.relatedFunction===deptName||k.tags.some(tag=>tag.includes(dept)||tag.includes(deptName)));
  
  // Count knowledge items by type for each folder
  const folderCounts={
    onboarding:deptKB.filter(k=>k.type==='Onboarding').length,
    rules:deptKB.filter(k=>k.type==='Policy'||k.type==='Rule').length,
    sop:deptKB.filter(k=>k.type==='SOP'||k.type==='Work Instruction').length,
    templates:deptKB.filter(k=>k.type==='Template').length,
    lessons:deptKB.filter(k=>k.type==='Lesson Learned'||k.type==='Best Practice').length,
    recovery:deptKB.filter(k=>k.type==='Recovery Action').length
  };
  // Add baseline counts if knowledge items are sparse
  if(deptKB.length<=3){
    folderCounts.lessons=deptKB.filter(k=>k.type==='Lesson Learned'||k.type==='Best Practice').length||1;
    folderCounts.recovery=deptKB.filter(k=>k.type==='Recovery Action').length||1;
    folderCounts.sop=1;
    folderCounts.templates=1;
  }
  
  h+='<div class="dcc-section"><div class="dcc-section-hdr"><div class="dcc-section-title"><span class="ico">📁</span> Department Management Hub</div><span class="dcc-section-badge blue">'+deptKB.length+' knowledge items</span></div>';
  h+='<div class="dcc-section-body">';
  h+='<div class="dcc-hub-grid">';
  DEPT_HUB_FOLDERS.forEach(folder=>{
    const count=folderCounts[folder.id]||0;
    h+='<div class="dcc-hub-folder" onclick="dccOpenHubFolder(\''+folder.id+'\',\''+dept+'\')">';
    h+='<div class="dcc-hub-folder-icon">'+folder.icon+'</div>';
    h+='<div class="dcc-hub-folder-body">';
    h+='<div class="dcc-hub-folder-name">'+folder.name+'</div>';
    h+='<div class="dcc-hub-folder-desc">'+folder.desc+'</div>';
    h+='<div class="dcc-hub-folder-meta"><span>'+count+' item'+(count!==1?'s':'')+'</span><span>Owner: '+folder.owner+'</span></div>';
    h+='</div>';
    h+='<button class="dcc-action-btn primary" style="align-self:center">Open</button>';
    h+='</div>';
  });
  h+='</div>';
  
  // Recent knowledge items
  if(deptKB.length){
    h+='<div class="dcc-hub-recent">';
    h+='<div class="dcc-hub-recent-title">Recent Items</div>';
    deptKB.slice(0,3).forEach(k=>{
      const ti=k.type==='Lesson Learned'?'💡':k.type==='Best Practice'?'✅':k.type==='Recovery Action'?'🔧':'📄';
      h+='<div class="dcc-kh-item">';
      h+='<div class="dcc-kh-header"><span class="dcc-kh-icon">'+ti+'</span><span class="dcc-kh-title">'+k.title+'</span><span class="badge bb" style="margin-left:8px">'+k.type+'</span></div>';
      if(k.summary) h+='<div class="dcc-kh-summary">'+(k.summary||'').slice(0,120)+'</div>';
      if(k.link) h+='<div class="dcc-kh-link"><a href="'+k.link+'" target="_blank" style="color:var(--blue);font-size:11px">🔗 Link</a></div>';
      if(k.tags&&k.tags.length) h+='<div class="dcc-kh-tags">'+k.tags.map(t=>'<span class="dcc-kh-tag">'+t+'</span>').join('')+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div></div>';
  
  // ========================================
  // MODULE 6: AI DEPARTMENT WORKBENCH
  // ========================================
  h+='<div class="dcc-ai-card"><div class="dcc-ai-title">🤖 AI Department Workbench — '+deptName+'</div>';
  h+='<div class="dcc-ai-text">';
  h+=deptName+' has <strong>'+openT.length+' open tasks</strong>, <strong style="color:'+(overdueT.length?'#f87171':'inherit')+'">'+overdueT.length+' overdue</strong>, <strong style="color:'+(delayedT.length?'#fbbf24':'inherit')+'">'+delayedT.length+' delayed</strong>. ';
  h+=riskProjects.length?'<span class="hi-red">'+riskProjects.length+' project(s) need attention.</span>':'<span class="hi-green">All projects on track.</span>';
  h+='</div>';
  h+='<div class="dcc-ai-actions">';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'summary\',\''+dept+'\')">📋 Summarize Dept</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'bottleneck\',\''+dept+'\')">🔍 Explain Bottleneck</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'similar\',\''+dept+'\')">🔎 Find Similar Case</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'recovery\',\''+dept+'\')">🔧 Suggest Recovery</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'escalation\',\''+dept+'\')">📢 Draft Escalation</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'report\',\''+dept+'\')">📊 Weekly Report</button>';
  h+='<button class="dcc-ai-btn" onclick="dccShowAI(this,\'priority\',\''+dept+'\')">🎯 Recommend Priority</button>';
  h+='</div><div class="dcc-ai-result" id="dcc-ai-dept"></div></div>';
  
  h+='</div>';
  return h;
}

// Helper: Add Recovery Plan (navigates to project with task edit)
function dccAddRecovery(projectId){
  navigateTo('projects',{projectId:projectId});
}

// Helper: Open Hub Folder
function dccOpenHubFolder(folderId, dept){
  // Future: navigate to full folder view. For now, show inline toast
  const cfg=getDeptConfig(dept);
  const folder=DEPT_HUB_FOLDERS.find(f=>f.id===folderId);
  if(!folder) return;
  // For now, navigate to Knowledge Center filtered by dept
  navigateTo('knowledge');
}

// ========================================
// AI DEPARTMENT WORKBENCH — Structured Output
// ========================================
function dccShowAI(btn, type, dept){
  const resultEl=btn.closest('.dcc-ai-card').querySelector('.dcc-ai-result');
  if(resultEl.classList.contains('show')&&resultEl.dataset.type===type){resultEl.classList.remove('show');return;}
  let html='';
  const cfg=getDeptConfig(dept);
  const deptName=cfg?cfg.name:dept;
  const dt=S.tasks.filter(t=>t.department===dept||t.department===deptName||(DEPT_ALIAS[t.department]===dept));
  const dp=S.projects.filter(p=>dt.some(t=>t.projectId===p.id));
  const deptUsers=S.users.filter(u=>u.dept===dept||u.dept===deptName);
  const openT=dt.filter(t=>t.status!=='Done'&&t.status!=='Completed');
  const overdueT=dt.filter(t=>isOverdue(t.dueDate,t.status));
  const delayedT=dt.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const riskProjects=dp.filter(p=>p.riskLevel==='High');
  
  // Recalculate workload
  const ownerWL={};
  deptUsers.forEach(u=>{
    const ut=dt.filter(t=>t.owner===u.name);
    const op=ut.filter(t=>t.status!=='Done'&&t.status!=='Completed');
    const crit=op.filter(t=>t.pri==='high');
    const od=op.filter(t=>isOverdue(t.dueDate,t.status));
    const projs=[...new Set(op.map(t=>t.projectId))];
    const capScore=op.length*1+crit.length*2+od.length*3+(projs.length>1?projs.length:0);
    const capStatus=capScore>10?'overload':capScore>5?'high':'ok';
    ownerWL[u.name]={open:op.length,critical:crit.length,overdue:od.length,total:ut.length,projects:projs.length,capScore,capStatus};
  });
  
  // Structured output helper
  function aiOutput(title,insight,action,owner,due,escalation){
    let s='<div class="dcc-ai-output">';
    s+='<div class="dcc-ai-output-title">'+title+'</div>';
    s+='<div class="dcc-ai-output-section"><span class="dcc-ai-output-label">💡 Insight:</span><div class="dcc-ai-output-value">'+insight+'</div></div>';
    s+='<div class="dcc-ai-output-section"><span class="dcc-ai-output-label">🎯 Recommended Next Action:</span><div class="dcc-ai-output-value">'+action+'</div></div>';
    s+='<div class="dcc-ai-output-section"><span class="dcc-ai-output-label">👤 Owner:</span><div class="dcc-ai-output-value">'+owner+'</div></div>';
    s+='<div class="dcc-ai-output-section"><span class="dcc-ai-output-label">📅 Due Date:</span><div class="dcc-ai-output-value">'+due+'</div></div>';
    s+='<div class="dcc-ai-output-section"><span class="dcc-ai-output-label">'+(escalation==='Needed'||escalation.startsWith('Needed')?'🚨':'✅')+' Escalation:</span><div class="dcc-ai-output-value">'+escalation+'</div></div>';
    s+='</div>';
    return s;
  }
  
  if(type==='summary'){
    const insight=deptName+' has '+openT.length+' open tasks across '+dp.length+' projects. '+(overdueT.length?overdueT.length+' overdue, ':'')+(delayedT.length?delayedT.length+' delayed/blocked. ':'')+(riskProjects.length?riskProjects.length+' high-risk project(s) require attention. ':'')+(Object.values(ownerWL).filter(o=>o.capStatus==='overload').length?Object.values(ownerWL).filter(o=>o.capStatus==='overload').length+' staff overloaded. ':'');
    const action=overdueT.length?'Review and resolve '+overdueT.length+' overdue tasks first, then address delayed/blockers.':'Monitor task progress and ensure on-time delivery.';
    const owner=cfg?cfg.leader:'Dept Lead';
    const due='This week';
    const esc=overdueT.length>3||riskProjects.length>1?'Needed — multiple overdue items and high-risk projects indicate systemic issue.':'Not needed at this time.';
    html+=aiOutput('📋 Department Summary — '+deptName,insight,action,owner,due,esc);
  } else if(type==='bottleneck'){
    const overloaded=Object.entries(ownerWL).filter(([n,d])=>d.capStatus!=='ok');
    let insight='';
    if(overloaded.length){
      insight+='<span class="hi-red">'+overloaded.length+' staff under pressure:</span> '+overloaded.map(([n,d])=>n+' ('+d.capStatus.toUpperCase()+', '+d.open+' open tasks, '+d.overdue+' overdue)').join('; ')+'. ';
    }
    if(delayedT.length){
      insight+='<span class="hi-orange">'+delayedT.length+' delayed/blocked tasks:</span> '+delayedT.map(t=>(t.name||'').slice(0,35)).join('; ')+'. ';
    }
    if(riskProjects.length){
      insight+='<span class="hi-red">'+riskProjects.length+' high-risk projects</span> ('+riskProjects.map(p=>p.sku||p.name).join(', ')+') may be impacted. ';
    }
    if(!insight) insight='No significant bottlenecks detected.';
    const topOverloaded=overloaded.sort((a,b)=>b[1].capScore-a[1].capScore)[0];
    const action=topOverloaded?'Redistribute workload from '+topOverloaded[0]+' (score: '+topOverloaded[1].capScore+') to available team members.':'Continue monitoring capacity.';
    const owner=topOverloaded?topOverloaded[0]+' / '+cfg?.leader:cfg?cfg.leader:'Dept Lead';
    const due='Within 48 hours';
    const esc=topOverloaded&&topOverloaded[1].capStatus==='overload'?'Needed if no redistribution plan within 48 hours.':'Not needed.';
    html+=aiOutput('🔍 Bottleneck Analysis — '+deptName,insight,action,owner,due,esc);
  } else if(type==='similar'){
    const kbs=S.knowledge.filter(k=>k.relatedFunction===dept||k.relatedFunction===deptName||k.tags.some(t=>t.includes(dept)||delayedT.some(dt=>dt.name&&dt.name.includes(t))));
    let insight='';
    if(kbs.length){
      insight=kbs.map(k=>'💡 <strong>'+k.title+'</strong> ('+k.type+'): '+(k.solution||k.prevention||'').slice(0,100)).join('<br>');
    } else {
      insight='No directly similar cases found in '+deptName+' Knowledge Hub. Consider searching across all departments.';
    }
    const action=delayedT.length?'Apply lessons from similar past cases to current delayed tasks: '+delayedT.map(t=>(t.name||'').slice(0,25)).join(', ')+'.':'Review historical cases proactively for prevention.';
    const owner=cfg?cfg.leader:'Dept Lead';
    const due='This week';
    const esc='Not needed — advisory insight only.';
    html+=aiOutput('🔎 Similar Cases — '+deptName,insight,action,owner,due,esc);
  } else if(type==='recovery'){
    const needRecovery=delayedT.filter(t=>!t.recoveryAction);
    let insight='';
    if(needRecovery.length){
      insight='<span class="hi-red">'+needRecovery.length+' tasks lack recovery actions:</span><br>'+needRecovery.map(t=>'• '+(t.name||'').slice(0,40)+' ('+t.status+', Owner: '+t.owner+')').join('<br>');
    } else if(delayedT.length){
      insight='All delayed tasks have recovery actions defined. Monitor execution.';
    } else {
      insight='<span class="hi-green">No delayed tasks requiring recovery action.</span>';
    }
    const action=needRecovery.length?'Define recovery actions for '+needRecovery.length+' tasks. Suggested approach: (1) Confirm root cause, (2) Identify alternative path, (3) Set target recovery date, (4) Assign clear owner.':'Review recovery action execution progress.';
    const owner=needRecovery[0]?needRecovery[0].owner+' / '+cfg?.leader:cfg?cfg.leader:'Dept Lead';
    const due=needRecovery.length?'Within 24 hours':'This week';
    const esc=needRecovery.length>2?'Needed — multiple tasks without recovery plans indicate process gap.':'Not needed.';
    html+=aiOutput('🔧 Recovery Suggestions — '+deptName,insight,action,owner,due,esc);
  } else if(type==='escalation'){
    const urgentTasks=dt.filter(t=>t.status==='Blocked'||(t.status==='Delayed'&&t.pri==='high'));
    let insight='';
    insight+='<div style="font-family:monospace;background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;font-size:10px;line-height:1.6">';
    insight+='<strong>To:</strong> PMO / VP NPI<br>';
    insight+='<strong>From:</strong> '+deptName+' Department ('+(cfg?cfg.leader:'Dept Lead')+')<br>';
    insight+='<strong>Subject:</strong> ⚠️ '+deptName+' Department — '+urgentTasks.length+' Blocker'+(urgentTasks.length>1?'s':'')+' Requiring Support<br>';
    insight+='<strong>Date:</strong> '+new Date().toLocaleDateString()+'<br><br>';
    insight+='<strong>Issues Requiring Decision:</strong><br>';
    if(urgentTasks.length){
      urgentTasks.forEach(t=>{
        const p=getProject(t.projectId);
        insight+='• '+(t.name||'').slice(0,50)+' ('+(p?.sku||'--')+') — <span class="hi-red">'+t.status+'</span><br>';
        insight+='&nbsp;&nbsp;Root Cause: '+(t.rootCause||'TBD')+' | Impact: '+(t.impact||t.impactedMs||t.blocker||'TBD')+'<br>';
        insight+='&nbsp;&nbsp;Owner: '+t.owner+' | Due: '+fmtShort(t.dueDate)+'<br>';
      });
    } else {
      insight+='No urgent blockers at this time.<br>';
    }
    insight+='<br><strong>Requested Action:</strong> Leadership review and resource allocation decision by end of week.';
    insight+='</div>';
    const action=urgentTasks.length?'Send escalation to PMO/VP for resource support and decision on '+urgentTasks.length+' blocker(s).':'No escalation needed at this time.';
    const owner=cfg?cfg.leader:'Dept Lead';
    const due='End of business today';
    const esc=urgentTasks.length>0?'Needed — blockers require leadership intervention.':'Not needed.';
    html+=aiOutput('📢 Escalation Draft — '+deptName,insight,action,owner,due,esc);
  } else if(type==='report'){
    const doneT=dt.filter(t=>t.status==='Done'||t.status==='Completed');
    let insight='';
    insight+='<strong>Week of:</strong> '+new Date().toLocaleDateString()+'<br>';
    insight+='<strong>Department:</strong> '+deptName+' ('+( cfg?cfg.leader:'Dept Lead')+')<br><br>';
    insight+='<strong>Summary:</strong> Supported '+dp.length+' projects with '+openT.length+' active tasks.<br>';
    insight+='<strong>Achievements:</strong> <span class="hi-green">'+doneT.length+' tasks completed.</span><br>';
    insight+='<strong>Challenges:</strong> '+(overdueT.length?'<span class="hi-red">'+overdueT.length+' overdue</span>, ':'')+(delayedT.length?'<span class="hi-orange">'+delayedT.length+' delayed/blocked</span>. ':'')+(overdueT.length+delayedT.length===0?'<span class="hi-green">No significant challenges.</span>':'')+'<br>';
    insight+='<strong>Capacity:</strong> '+Object.values(ownerWL).filter(o=>o.capStatus==='overload').length+' overloaded, '+Object.values(ownerWL).filter(o=>o.capStatus==='high').length+' high load.<br>';
    insight+='<strong>Next Week Focus:</strong> '+(overdueT.length?'Clear '+overdueT.length+' overdue tasks. ':'')+(riskProjects.length?'Support '+riskProjects.length+' high-risk projects. ':'')+'Maintain critical path delivery.';
    const action='Review with team in weekly standup. Focus on overdue items and capacity rebalancing.';
    const owner=cfg?cfg.leader:'Dept Lead';
    const due='Next Monday';
    const esc=overdueT.length>5?'Needed — overdue volume exceeds threshold for self-resolution.':'Not needed.';
    html+=aiOutput('📊 Weekly Report — '+deptName,insight,action,owner,due,esc);
  } else if(type==='priority'){
    const priTasks=dt.filter(t=>t.pri==='high'||t.status==='Blocked'||isOverdue(t.dueDate,t.status)).sort((a,b)=>{
      const scoreA=(a.status==='Blocked'?100:0)+(isOverdue(a.dueDate,a.status)?50:0)+(a.pri==='high'?30:0);
      const scoreB=(b.status==='Blocked'?100:0)+(isOverdue(b.dueDate,b.status)?50:0)+(b.pri==='high'?30:0);
      return scoreB-scoreA;
    }).slice(0,5);
    let insight='';
    if(priTasks.length){
      insight='Top '+priTasks.length+' priority items:<br>'+priTasks.map((t,i)=>{
        const p=getProject(t.projectId);
        return '<strong>'+(i+1)+'. '+(t.name||'').slice(0,40)+'</strong> — '+(t.status==='Blocked'?'<span class="hi-red">BLOCKED</span>':isOverdue(t.dueDate,t.status)?'<span class="hi-orange">OVERDUE</span>':t.pri==='high'?'<span class="hi-red">HIGH PRI</span>':t.status)+' | '+(p?.sku||'--')+' | Owner: '+t.owner;
      }).join('<br>');
    } else {
      insight='<span class="hi-green">No high-priority items at this time.</span>';
    }
    const topTask=priTasks[0];
    const action=topTask?'Focus on: '+(topTask.name||'').slice(0,50)+' ('+topTask.status+', '+topTask.owner+'). Resolve blocker or confirm recovery plan.':'Continue standard execution.';
    const owner=topTask?topTask.owner:cfg?cfg.leader:'Dept Lead';
    const due=topTask?fmtShort(topTask.dueDate):'This week';
    const esc=topTask&&topTask.status==='Blocked'?'Needed — blocked task cannot proceed without decision.':'Not needed.';
    html+=aiOutput('🎯 Priority Recommendations — '+deptName,insight,action,owner,due,esc);
  }
  
  resultEl.innerHTML=html;
  resultEl.classList.add('show');
  resultEl.dataset.type=type;
}

/* Keep REAL_DEPT_STATS for Portfolio View */


/* ===== APP INIT ===== */
const APP_VERSION = '22.2';

function seedData(){
  // Generate demo projects
  const brands = ['Ninja','Shark'];
  const categories = ['Motorized','Heated Indoor','Personal Care','Coffee','Corded Stick','Robot Vacuum','Air Purifier','Handheld'];
  const types = ['Extension','NPD CAT A','NPD CAT B','NPD CAT C','Cost Down','Sourcing'];
  const phases = ['Kickoff','ECN OPEN','ECN DD','EB Build','Sample & Test','ECN IMP','MP'];
  const depts = DEPARTMENTS;
  const statuses = ['Not Started','In Progress','At Risk','Delayed','Blocked','Done'];
  const riskLevels = ['High','Medium','Low'];
  
  const projects = [];
  const tasks = [];
  const issues = [];
  const deliverables = [];
  const milestones = [];
  
  // Generate 15 projects
  for(let i=0;i<15;i++){
    const brand = brands[i%2];
    const cat = categories[i%categories.length];
    const type = types[i%types.length];
    const phase = phases[Math.min(Math.floor(i/2.5),6)];
    const healthScore = Math.max(10,Math.min(100, 85 - i*4 + Math.floor(Math.random()*20)));
    
    const pId = 'P'+(1001+i);
    const sku = brand[0]+cat[0]+type[0]+String(i+1).padStart(3,'0');
    projects.push({
      id:pId, name:sku+' '+type+' '+cat,
      brand:brand, category:cat, type:type,
      phase:phase, status:i<3?'On Track':i<7?'At Risk':'Delayed',
      healthScore:healthScore,
      startDate:'2026-0'+(1+i%3)+'-01',
      targetLaunch:'2026-0'+(7+i%4)+'-'+String(15+i%10).padStart(2,'0'),
      dept:depts[i%depts.length],
      owner:S.users[i%S.users.length].name
    });
    
    // Generate tasks per project
    const numTasks = 4 + Math.floor(Math.random()*5);
    for(let j=0;j<numTasks;j++){
      const taskDept = depts[(i+j)%depts.length];
      const taskStatus = j===0&&i>5?'Overdue':j<2?'In Progress':j<4?'At Risk':'Not Started';
      const dueDate = '2026-0'+(2+j%6)+'-'+String(10+j%20).padStart(2,'0');
      tasks.push({
        id:'T'+(1001+i*10+j),
        projectId:pId,
        name:taskDept+' Deliverable '+(j+1),
        dept:taskDept,
        owner:S.users[(i+j)%S.users.length].name,
        status:taskStatus==='Overdue'?'Delayed':taskStatus,
        priority:j<2?'High':j<4?'Medium':'Low',
        dueDate:dueDate,
        gate:phases[Math.min(j,6)]
      });
    }
    
    // Generate some issues
    if(i>2){
      issues.push({
        id:'I'+(1001+i),
        projectId:pId,
        type:i%3===0?'Blocker':i%3===1?'Delay':'Risk',
        description:type+' '+cat+' issue in '+phase,
        severity:riskLevels[i%3],
        status:'Open',
        owner:S.users[(i+1)%S.users.length].name,
        dueDate:'2026-0'+(3+i%4)+'-01'
      });
    }
    
    // Generate milestones
    for(let j=0;j<3;j++){
      milestones.push({
        id:'M'+(1001+i*3+j),
        projectId:pId,
        name:phases[(j*2)%7]+' Gate',
        date:'2026-0'+(2+j*2)+'-'+String(15+j*5).padStart(2,'0'),
        status:j===0?'Completed':'Upcoming'
      });
    }
  }
  
  S.projects=projects;
  S.tasks=tasks;
  S.issues=issues;
  S.deliverables=deliverables;
  S.milestones=milestones;
  S.knowledge=[];
  S.aiHistory=[];
  S._v=DATA_VERSION;
  saveData();
}

function initApp(){
  if(!loadData()){
    initData();
  }
  render();
  // Update version display
  const sv=document.getElementById('sidebarVersion');
  if(sv) sv.textContent='v'+APP_VERSION;
}

/* ===== UI UTILITIES ===== */
function toggleAI(){
  const p=document.getElementById('aiPanel');
  if(p) p.classList.toggle('open');
}

/* toggleSidebar, toggleUserMenu, exportData, importData already defined above */

function handleGlobalSearch(ev){
  if(ev.key==='Enter'){
    const q=ev.target.value.trim().toLowerCase();
    if(!q) return;
    // Search projects
    const found=S.projects.find(p=>p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q));
    if(found){
      navigateTo('projects',{projectId:found.id});
    } else {
      toast('No results for: '+q);
    }
  }
}

// Close dropdown on outside click
document.addEventListener('click',function(e){
  const dd=document.getElementById('userDropdown');
  if(dd && !e.target.closest('.user-info') && !e.target.closest('.user-dropdown')){
    dd.classList.remove('show');
  }
});

// Start app
// Global error handler for debugging
window.onerror=function(msg,url,line,col,err){
  const d=document.getElementById('content');
  if(d) d.innerHTML='<div style="padding:40px;color:#ef4444;font-family:monospace;background:#1e1e1e;margin:20px;border-radius:8px"><h2>JS Error</h2><pre>'+msg+'\nLine: '+line+'\n\n'+(err?err.stack:'')+'</pre></div>';
  console.error('Global error:',msg,line,err);
};
try{
  initApp();
}catch(e){
  document.getElementById('content').innerHTML='<div style="padding:40px;color:#ef4444;font-family:monospace;background:#1e1e1e;margin:20px;border-radius:8px"><h2>Init Error</h2><pre>'+e.message+'\n\n'+e.stack+'</pre></div>';
}
