/* 右侧操作按钮 */
function dwBuildActions(tid){
  const t=S.tasks.find(x=>x.id===tid);if(!t)return'';
  return`<button class="btn btn-primary btn-sm" onclick="dwSaveDetail()">💾 Save</button>
    <button class="btn btn-secondary btn-sm" onclick="navigateTo('projects',{projectId:'${t.projectId}'})">📁 Go to Project</button>
    ${t.status!=='Done'?`<button class="btn btn-secondary btn-sm" onclick="dwQuickDone('${tid}')">✅ Mark Done</button>`:''}
    <button class="btn btn-secondary btn-sm" onclick="dwAsk('Summarize this task')">🤖 Ask AI</button>`;
}

/* 选中任务 */
function dwSelectTask(tid){
  DW_SELECTED_TASK=tid;
  // 高亮
  document.querySelectorAll('.dw-task-row').forEach(el=>el.classList.remove('selected'));
  const el=document.querySelector(`.dw-task-row[data-tid="${tid}"]`);
  if(el)el.classList.add('selected');
  // 展开右侧栏
  const right=document.getElementById('dwRight');
  if(right){
    right.classList.remove('hidden');
    const scroll=document.getElementById('dwRightScroll');
    const actions=document.getElementById('dwRightActions');
    const title=document.getElementById('dwRightTitle');
    const t=S.tasks.find(x=>x.id===tid);
    if(t&&title)title.textContent=(t.name||'').slice(0,40)+((t.name||'').length>40?'…':'');
    if(scroll)scroll.innerHTML=dwBuildDetail(tid);
    if(actions)actions.innerHTML=dwBuildActions(tid);
    else{
      // actions div 不存在，插入
      const actDiv=document.createElement('div');
      actDiv.id='dwRightActions';actDiv.className='dw-right-actions';
      actDiv.innerHTML=dwBuildActions(tid);
      right.appendChild(actDiv);
    }
  }
}

/* 关闭右侧详情 */
function dwCloseDetail(){
  DW_SELECTED_TASK=null;
  document.querySelectorAll('.dw-task-row').forEach(el=>el.classList.remove('selected'));
  const right=document.getElementById('dwRight');
  if(right)right.classList.add('hidden');
}

/* 实时 patch（不立即保存） */
function dwPatch(field,value){
  if(!DW_SELECTED_TASK)return;
  const t=S.tasks.find(x=>x.id===DW_SELECTED_TASK);
  if(!t)return;
  t[field]=value;
  // 同步任务行状态指示
  const row=document.querySelector(`.dw-task-row[data-tid="${DW_SELECTED_TASK}"]`);
  if(row&&field==='status'){
    row.className=`dw-task-row selected ${dwTaskLineCls(t)}`;
  }
}

/* 状态变更（可能需要 recovery） */
function dwChangeStatus(newSt){
  if(!DW_SELECTED_TASK)return;
  const t=S.tasks.find(x=>x.id===DW_SELECTED_TASK);
  if(!t)return;
  t.status=newSt;
  if((newSt==='Delayed'||newSt==='Blocked')&&(!t.rootCause||!t.recoveryAction)){
    // 重新渲染详情，强调 recovery 必填
    const scroll=document.getElementById('dwRightScroll');
    if(scroll)scroll.innerHTML=dwBuildDetail(DW_SELECTED_TASK);
    toast('Please fill in Root Cause and Recovery Action','error');
    return;
  }
  const scroll=document.getElementById('dwRightScroll');
  if(scroll)scroll.innerHTML=dwBuildDetail(DW_SELECTED_TASK);
  // 同步任务行
  const row=document.querySelector(`.dw-task-row[data-tid="${DW_SELECTED_TASK}"]`);
  if(row){
    const nameDiv=row.querySelector('.dw-tr-name');
    if(nameDiv){
      // 更新 tags
      const tagSpans=nameDiv.querySelectorAll('.dw-tag');
      tagSpans.forEach(el=>el.remove());
      nameDiv.insertAdjacentHTML('beforeend',dwTaskTags(t));
    }
    row.className=`dw-task-row selected ${dwTaskLineCls(t)}`;
  }
}

/* 保存详情 */
function dwSaveDetail(){
  if(!DW_SELECTED_TASK)return;
  const t=S.tasks.find(x=>x.id===DW_SELECTED_TASK);
  if(!t)return;
  const isDB=t.status==='Delayed'||t.status==='Blocked';
  if(isDB&&(!t.rootCause?.trim()||!t.recoveryAction?.trim())){
    toast('Root Cause and Recovery Action are required for Delayed/Blocked tasks','error');
    return;
  }
  // 同步项目健康
  const proj=getProject(t.projectId);
  if(proj){
    const allPT=projTasks(t.projectId);
    const blocked=allPT.filter(x=>x.status==='Blocked').length;
    const delayed=allPT.filter(x=>x.status==='Delayed').length;
    const done=allPT.filter(x=>x.status==='Done'||x.status==='Completed').length;
    proj.healthScore=Math.max(10,100-blocked*20-delayed*10);
    if(blocked>0)proj.status='Blocked';
    else if(delayed>0)proj.status='At Risk';
    if(t.recoveryAction)proj.recoveryAction=t.recoveryAction;
    if(t.rootCause)proj.keyIssue=(t.name||'').slice(0,40);
  }
  saveData();
  toast('Task saved ✓');
  // 刷新任务列表行（用 innerHTML 替换内容，避免 outerHTML 替换后 DOM 引用丢失）
  const row=document.querySelector(`.dw-task-row[data-tid="${DW_SELECTED_TASK}"]`);
  if(row){
    const tempDiv=document.createElement('div');
    tempDiv.innerHTML=dwBuildTaskList([t]);
    const newRowEl=tempDiv.querySelector(`.dw-task-row[data-tid="${DW_SELECTED_TASK}"]`);
    if(newRowEl){
      row.innerHTML=newRowEl.innerHTML;
      row.className=newRowEl.className;
      row.classList.add('selected');
    }
  }
}

/* 快速完成 */
function dwQuickDone(tid){
  const t=S.tasks.find(x=>x.id===tid);if(!t)return;
  t.status='Done';t.prog=100;t.riskFlag=false;t.delayFlag=false;
  DW_SELECTED_TASK=null;
  saveData();
  dwCloseDetail();
  toast('Task marked Done ✓');
  // 重新渲染任务列表以显示灰色完成样式
  dwRefilter();
}

/* 左侧项目过滤 */
function dwFilterProj(pid){
  DW_PROJ_FILTER=pid;
  // 更新左侧高亮
  document.querySelectorAll('.dw-proj-item').forEach(el=>{
    const oid=el.getAttribute('onclick');
    if(pid===null){
      el.classList.toggle('active',oid&&oid.includes('null'));
    }else{
      el.classList.toggle('active',oid&&oid.includes(`'${pid}'`));
    }
  });
  // 过滤中间列表 (包含已完成任务)
  const myAll=S.tasks.filter(t=>t.owner==='Sunny');
  let filtered=pid?myAll.filter(t=>t.projectId===pid):myAll;
  const srch=(document.getElementById('dwSearch')?.value||'').toLowerCase();
  const stFilter=document.getElementById('dwFilterStatus')?.value||'';
  if(srch)filtered=filtered.filter(t=>(t.name+t.owner+(getProject(t.projectId)?.sku||'')+(getProject(t.projectId)?.name||'')).toLowerCase().includes(srch));
  if(stFilter)filtered=filtered.filter(t=>t.status===stFilter);
  const list=document.getElementById('dwTaskList');
  if(list)list.innerHTML=dwBuildTaskList(filtered);
  const cnt=document.getElementById('dwTaskCount');
  if(cnt)cnt.textContent=filtered.length+' tasks';
}

/* 搜索/排序/过滤 */
function dwRefilter(){
  const srch=(document.getElementById('dwSearch')?.value||'').toLowerCase();
  const sortBy=document.getElementById('dwSortBy')?.value||'priority';
  const stFilter=document.getElementById('dwFilterStatus')?.value||'';
  const priOrder={'high':0,'medium':1,'low':2};
  const myAll=S.tasks.filter(t=>t.owner==='Sunny');
  let filtered=DW_PROJ_FILTER?myAll.filter(t=>t.projectId===DW_PROJ_FILTER):myAll;
  if(srch)filtered=filtered.filter(t=>(t.name+t.owner+(getProject(t.projectId)?.sku||'')+(getProject(t.projectId)?.name||'')+t.ms).toLowerCase().includes(srch));
  if(stFilter)filtered=filtered.filter(t=>t.status===stFilter);
  // Sort — done tasks always go to bottom; active tasks sorted by chosen key
  filtered.sort((a,b)=>{
    const aDone=(a.status==='Done'||a.status==='Completed')?1:0;
    const bDone=(b.status==='Done'||b.status==='Completed')?1:0;
    if(aDone!==bDone)return aDone-bDone;
    if(sortBy==='priority')return(priOrder[a.pri||'medium']||1)-(priOrder[b.pri||'medium']||1);
    if(sortBy==='due')return(a.dueDate||'9999')>(b.dueDate||'9999')?1:-1;
    if(sortBy==='status')return(a.status||'').localeCompare(b.status||'');
    if(sortBy==='project')return(a.projectId||'').localeCompare(b.projectId||'');
    return 0;
  });
  const list=document.getElementById('dwTaskList');
  if(list)list.innerHTML=dwBuildTaskList(filtered);
  const cnt=document.getElementById('dwTaskCount');
  if(cnt)cnt.textContent=filtered.length+' tasks';
}

/* AI Chat */
function dwAsk(q){
  const t=DW_SELECTED_TASK?S.tasks.find(x=>x.id===DW_SELECTED_TASK):null;
  const p=t?getProject(t.projectId):null;
  const input=document.getElementById('dwAiInput');
  if(input)input.value=q;
  const resp=document.getElementById('dwAiResponse');
  if(!resp)return;
  let ans='';
  const lq=q.toLowerCase();
  if(lq.includes('summarize my day')||lq.includes('summary')){
    const myAll=S.tasks.filter(t=>t.status!=='Done'&&t.owner==='Sunny');
    const ov=myAll.filter(t=>isOverdue(t.dueDate,t.status));
    const bl=myAll.filter(t=>t.status==='Blocked');
    ans=`🤖 <b>Today's Summary:</b><br>You have <b>${myAll.length} open tasks</b> across ${[...new Set(myAll.map(t=>t.projectId))].length} projects.<br>${ov.length?`⚠️ <b>${ov.length} overdue</b>: ${ov.map(x=>x.name.slice(0,30)).join(', ')}.<br>`:''}${bl.length?`🔴 <b>${bl.length} blocked</b>: ${bl.map(x=>x.name.slice(0,30)).join(', ')}.<br>`:''}Prioritize recovery actions for delayed/blocked tasks today.`;
  }else if(lq.includes('focus')){
    const myAll=S.tasks.filter(t=>t.status!=='Done'&&t.owner==='Sunny');
    const pri=myAll.filter(t=>t.pri==='high'||t.status==='Blocked'||isOverdue(t.dueDate,t.status)).slice(0,3);
    ans=`🤖 <b>Top 3 Focus Items:</b><br>${pri.map((t,i)=>`${i+1}. <b>${t.name}</b> — ${t.status}${t.delayDays>0?' (+'+t.delayDays+'d)':''}`).join('<br>')||'All tasks are on track!'}`;
  }else if(lq.includes('explain')&&t){
    ans=`🤖 <b>Delay Analysis: ${(t.name||'').slice(0,40)}</b><br>Status: <b>${t.status}</b>${t.delayDays>0?' (+'+t.delayDays+' days)':''}<br>${t.rootCause?`Root Cause: ${t.rootCause}<br>`:'Root Cause not filled in yet.<br>'}${t.impactedMs?`Impacted Milestone: ${t.impactedMs}<br>`:''}${t.recoveryAction?`Recovery Plan: ${t.recoveryAction}`:'No recovery action yet — please fill in the right panel.'}`;
  }else if(lq.includes('follow-up')&&t){
    const due=fmtShort(t.dueDate);
    ans=`🤖 <b>Draft Follow-up:</b><br><i>Hi ${t.owner},<br>Just following up on task "<b>${t.name}</b>" (due ${due}, Status: ${t.status}). ${t.status==='Delayed'?`Current delay: +${t.delayDays||0}d. `:''}Could you please provide a status update${t.status==='Delayed'?' and confirm the recovery timeline':''}? Let me know if you need any support.<br>Thanks, Sunny</i>`;
  }else if(lq.includes('similar')){
    const kbs=S.knowledge.slice(0,2);
    ans=`🤖 <b>Similar Issues in Knowledge Base:</b><br>${kbs.map(k=>`• <b>${k.title}</b> (${k.type}): ${k.solution?.slice(0,80)||'—'}`).join('<br>')||'No similar cases found.'}`;
  }else if(lq.includes('update')||lq.includes('report')){
    const myAll=S.tasks.filter(t=>t.owner==='Sunny'&&t.status!=='Done');
    ans=`🤖 <b>Task Update Summary:</b><br>${myAll.slice(0,5).map(t=>`• <b>${t.name}</b> — ${t.status}${t.delayDays>0?' +'+t.delayDays+'d':''} | Due ${fmtShort(t.dueDate)}`).join('<br>')}`;
  }else if(t){
    ans=`🤖 <b>About "${(t.name||'').slice(0,40)}":</b><br>Project: ${p?.name||'—'} | Status: <b>${t.status}</b> | Owner: ${t.owner}<br>Due: ${fmtShort(t.dueDate)}${t.delayDays>0?' (+'+t.delayDays+'d)':''} | MS: ${t.ms||'—'}<br>${t.rootCause?`Root Cause: ${t.rootCause}<br>`:''}${t.recoveryAction?`Recovery: ${t.recoveryAction}`:''}`;
  }else{
    ans=`🤖 I'm your AutoPM AI assistant. Select a task first, or ask me to summarize your day, find similar issues, or generate a task update.`;
  }
  resp.innerHTML=ans;
  resp.classList.add('show');
}

function getFilteredProjects(){
  let ps=S.projects;
  const search=S.filters.search?.toLowerCase()||'';
  if(search)ps=ps.filter(p=>p.name.toLowerCase().includes(search)||p.sku.toLowerCase().includes(search)||(p.pm||'').toLowerCase().includes(search));
  if(S.filters.status)ps=ps.filter(p=>p.status===S.filters.status);
  if(S.filters.type)ps=ps.filter(p=>p.type===S.filters.type);
  if(S.filters.risk)ps=ps.filter(p=>p.riskLevel===S.filters.risk);
  if(S.filters.pm)ps=ps.filter(p=>p.pm===S.filters.pm);
  return ps;
}

function filterProjects(){
  S.filters.search=document.getElementById('projSearch')?.value||'';
  S.filters.status=document.getElementById('projStatus')?.value||'';
  S.filters.type=document.getElementById('projType')?.value||'';
  S.filters.risk=document.getElementById('projRisk')?.value||'';
  S.filters.pm=document.getElementById('projPM')?.value||'';
  const tbody=document.getElementById('projTableBody');
  if(!tbody){render();return;}
  let ps=getFilteredProjects();
  tbody.innerHTML=ps.map(p=>{
    const gp=Math.round(p.gates.filter(g=>g.status==='Done').length/NPI_GATES.length*100);
    const cg=NPI_GATES[p.currentGate]||NPI_GATES[0];
    return`<tr class="row-link" onclick="navigateTo('projects',{projectId:'${p.id}'})">
      <td><div class="fw6">${p.name}</div><div class="text-xs text-muted">${p.sku}</div></td>
      <td><span class="badge bgr">${p.type}</span></td>
      <td><span class="text-sm">${cg.name}</span></td>
      <td class="text-sm">${p.pm}</td>
      <td class="text-sm">${fmtShort(p.targetLaunch)}</td>

      <td>${sBadge(p.status)}</td>
      <td><span class="badge ${riskCls(p.riskLevel)}">${p.riskLevel}</span></td>

function renderCompany(c){
  c=document.getElementById('content');
  // Data preparation
  const total=S.projects.length;
  const onTrack=S.projects.filter(p=>p.healthScore>=70);
  const atRisk=S.projects.filter(p=>p.healthScore>=50&&p.healthScore<70);
  const critical=S.projects.filter(p=>p.healthScore<50);
  const delayed=S.projects.filter(p=>p.status==='Delayed');
  const blocked=S.projects.filter(p=>p.status==='Blocked');
  const inMP=S.projects.filter(p=>p.status==='In MP'||p.status==='Completed');
  const scoping=S.projects.filter(p=>p.status==='Scoping'||p.status==='Not Started');
  const onHold=S.projects.filter(p=>p.status==='On Hold'||p.status==='Cancelled');
  const avgHealth=total?Math.round(S.projects.reduce((s,p)=>s+p.healthScore,0)/total):0;
  const openEsc=S.issues.filter(i=>i.status==='Open'&&i.escalation);
  const decisions=S.issues.filter(i=>i.type==='Decision Needed'&&i.status==='Open');
  const delayedTasks=S.tasks.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const overdueTasks=S.tasks.filter(t=>isOverdue(t.dueDate,t.status));
  const scoreCls=avgHealth>=70?'green':avgHealth>=50?'orange':'red';
  const scoreBg=avgHealth>=70?'#14532d':avgHealth>=50?'#78350f':'#7f1d1d';
  const scoreColor=avgHealth>=70?'#4ade80':avgHealth>=50?'#fbbf24':'#f87171';

  let h='<div class="emc-root">';

  // ═══ MODULE 1: AI EXECUTIVE BRIEF ═══
  const topRiskProj=[...S.projects].sort((a,b)=>a.healthScore-b.healthScore)[0];
  const maxDelayProj=[...S.projects].sort((a,b)=>b.delayDays-a.delayDays)[0];
  const deptBottlenecks=DEPARTMENTS.map(d=>{
    const dt=S.tasks.filter(t=>t.department===d);
    const dd=dt.filter(t=>t.status==='Delayed'||t.status==='Blocked');
    const od=dt.filter(t=>isOverdue(t.dueDate,t.status));
    const totalDelay=dd.reduce((s,t)=>s+(t.delayDays||0),0);
    const avgDelay=dd.length?Math.round(totalDelay/dd.length):0;
    const rootCauses={};
    dd.forEach(t=>{const rc=t.rootCause||'Unknown';rootCauses[rc]=(rootCauses[rc]||0)+1;});
    const topRC=Object.entries(rootCauses).sort((a,b)=>b[1]-a[1])[0];
    return{dept:d,impacted:[...new Set(dt.map(t=>t.projectId))].length,overdue:od.length,delayed:dd.length,avgDelay,totalDelay,topRC:topRC?topRC[0]:null,pressure:dd.length>3?'overload':dd.length>1?'high':'ok'};
  }).sort((a,b)=>b.totalDelay-a.totalDelay);

  h+='<div class="emc-brief">';
  h+='<div class="emc-brief-title">🤖 AI Executive Brief</div>';
  h+='<div class="emc-brief-text">';
  // Health statement
  if(avgHealth>=70){
    h+='Portfolio is <strong class="hi-green">healthy</strong> with an overall score of <strong>'+avgHealth+'/100</strong>. ';
  } else if(avgHealth>=50){
    h+='Portfolio <strong class="hi-orange">needs attention</strong> with a score of <strong>'+avgHealth+'/100</strong>. ';
  } else {
    h+='Portfolio is <strong class="hi-red">at risk</strong> with a score of <strong>'+avgHealth+'/100</strong>. ';
  }
  h+='<strong>'+onTrack.length+'/'+total+'</strong> projects on track';
  if(critical.length) h+=', <strong class="hi-red">'+critical.length+' critical</strong>';
  if(atRisk.length) h+=', <strong class="hi-orange">'+atRisk.length+' at risk</strong>';
  h+='.<br>';
  // Max risk
  if(topRiskProj){
    h+='Greatest risk: <strong class="hi-red">'+(topRiskProj.sku||topRiskProj.name)+'</strong> (Health: '+topRiskProj.healthScore+(topRiskProj.delayDays>0?', +'+topRiskProj.delayDays+'d delay':'')+'). ';
  }
  // Dept bottleneck
  if(deptBottlenecks[0]&&deptBottlenecks[0].totalDelay>0){
    h+='<br>Top bottleneck: <strong class="hi-orange">'+deptBottlenecks[0].dept+'</strong> (+ '+deptBottlenecks[0].totalDelay+'d total delay across '+deptBottlenecks[0].impacted+' projects). ';
  }
  // Launch impact
  const launchImpact=S.projects.filter(p=>p.delayDays>0&&p.status!=='Completed'&&p.status!=='On Hold');
  if(launchImpact.length){
    h+='<br><strong class="hi-red">'+launchImpact.length+' project(s) may impact launch</strong>: '+launchImpact.slice(0,3).map(p=>p.sku||p.name).join(', ')+(launchImpact.length>3?' +more':'')+'. ';
  }
  // Decisions needed
  if(decisions.length){
    h+='<br><strong class="hi-orange">'+decisions.length+' pending decision(s)</strong> require leadership action. ';
  }
  // What to focus on today
  h+='<br><strong class="hi-blue">Today\'s focus:</strong> ';
  if(critical.length){
    h+='Resolve '+critical.length+' critical project(s) — '+critical.slice(0,2).map(p=>p.sku||p.name).join(', ')+'.';
  } else if(openEsc.length){
    h+='Address '+openEsc.length+' escalated issue(s) requiring executive decision.';
  } else if(deptBottlenecks[0]&&deptBottlenecks[0].pressure==='overload'){
    h+='Support '+deptBottlenecks[0].dept+' department — resource overload detected.';
  } else {
    h+='Portfolio stable. Review upcoming gate milestones and proactive risk mitigation.';
  }
  h+='</div>';
  // Tags
  h+='<div style="margin-top:8px">';
  h+='<span class="emc-brief-tag '+scoreCls+'">Health: '+avgHealth+'</span>';
  if(critical.length) h+='<span class="emc-brief-tag red">'+critical.length+' Critical</span>';
  if(launchImpact.length) h+='<span class="emc-brief-tag red">'+launchImpact.length+' Launch Risk</span>';
  if(decisions.length) h+='<span class="emc-brief-tag orange">'+decisions.length+' Decisions</span>';
  if(deptBottlenecks.filter(d=>d.pressure==='overload').length) h+='<span class="emc-brief-tag orange">'+deptBottlenecks.filter(d=>d.pressure==='overload').length+' Dept Bottleneck</span>';
  if(avgHealth>=70&&critical.length===0) h+='<span class="emc-brief-tag green">Stable</span>';
  h+='</div></div>';

  // ═══ MODULE 2: PORTFOLIO HEALTH KPI ═══
  const d=REAL_DEPT_STATS;
  h+='<div class="emc-section"><div class="emc-section-hdr"><div class="emc-section-title"><span class="ico">📊</span> Portfolio Health KPI</div></div>';
  h+='<div class="emc-section-body">';
  h+='<div class="emc-kpi-grid">';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val">'+d.total+'</div><div class="emc-kpi-lbl">Total SKUs</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#60a5fa">'+d.active+'</div><div class="emc-kpi-lbl">Active Projects</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#4ade80">'+d.onTrack+'</div><div class="emc-kpi-lbl">On Track</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#fbbf24">'+d.atRisk+'</div><div class="emc-kpi-lbl">At Risk</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#f87171">'+delayed.length+'</div><div class="emc-kpi-lbl">Delayed</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#dc2626">'+blocked.length+'</div><div class="emc-kpi-lbl">Blocked</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#94a3b8">'+d.inMP+'</div><div class="emc-kpi-lbl">In MP</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#94a3b8">'+d.scoping+'</div><div class="emc-kpi-lbl">Scoping</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#64748b">'+d.onHold+'</div><div class="emc-kpi-lbl">On Hold/Cancelled</div></div>';
  h+='<div class="emc-kpi-card score-card"><div class="emc-score-ring" style="background:'+scoreBg+';color:'+scoreColor+'">'+avgHealth+'</div><div><div class="emc-kpi-val" style="color:'+scoreColor+';font-size:28px">'+avgHealth+'/100</div><div class="emc-kpi-lbl">Portfolio Health Score</div></div></div>';
  h+='</div></div></div>';

  // ═══ MODULE 3: LAUNCH / BUSINESS IMPACT ═══
  const launchDelay=S.projects.filter(p=>p.delayDays>0&&p.status!=='Completed'&&p.status!=='On Hold');
  const totalDelayDays=launchDelay.reduce((s,p)=>s+p.delayDays,0);
  const delay7=launchDelay.filter(p=>p.delayDays>=7).length;
  const delay14=launchDelay.filter(p=>p.delayDays>=14).length;
  const delay30=launchDelay.filter(p=>p.delayDays>=30).length;
  const impactedBrands=[...new Set(launchDelay.map(p=>p.brand).filter(Boolean))];
  const impactedCats=[...new Set(launchDelay.map(p=>p.category||p.type).filter(Boolean))];

  h+='<div class="emc-section"><div class="emc-section-hdr"><div class="emc-section-title"><span class="ico">🚀</span> Launch / Business Impact</div><span class="emc-section-badge '+(launchDelay.length?'red':'green')+'">'+launchDelay.length+' projects with delay</span></div>';
  h+='<div class="emc-section-body">';
  h+='<div class="emc-kpi-grid" style="margin-bottom:10px">';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#f87171">'+launchDelay.length+'</div><div class="emc-kpi-lbl">Launch Impact</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#f87171">+'+totalDelayDays+'d</div><div class="emc-kpi-lbl">Total Delay Days</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#fbbf24">'+delay7+'</div><div class="emc-kpi-lbl">Delay &ge;7d</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#f87171">'+delay14+'</div><div class="emc-kpi-lbl">Delay &ge;14d</div></div>';
  h+='<div class="emc-kpi-card"><div class="emc-kpi-val" style="color:#dc2626">'+delay30+'</div><div class="emc-kpi-lbl">Delay &ge;30d</div></div>';
  h+='</div>';
  if(launchDelay.length){
    h+='<table class="emc-table"><thead><tr><th>Project</th><th>Brand</th><th>Category</th><th>Launch</th><th>Delay</th><th>Key Issue</th><th></th></tr></thead><tbody>';
    launchDelay.sort((a,b)=>b.delayDays-a.delayDays).slice(0,10).forEach(p=>{
      h+='<tr><td><span class="pn" onclick="navigateTo(\'projects\',{projectId:\''+p.id+'\'})">'+(p.sku||p.name)+'</span></td>';
      h+='<td>'+(p.brand||'--')+'</td>';
      h+='<td>'+(p.category||p.type||'--')+'</td>';
      h+='<td>'+fmtShort(p.targetLaunch)+'</td>';
      h+='<td class="num" style="color:#f87171">+'+p.delayDays+'d</td>';
      h+='<td style="font-size:10px;max-width:180px;overflow:hidden;text-overflow:ellipsis">'+(p.keyIssue||'--')+'</td>';
      h+='<td><button class="dcc-action-btn primary" onclick="navigateTo(\'projects\',{projectId:\''+p.id+'\'})">Open</button></td></tr>';
    });
    h+='</tbody></table>';
  } else {
    h+='<div style="padding:20px;text-align:center;color:var(--t3)"><div style="font-size:28px;margin-bottom:8px">✅</div><div>No projects currently impacting launch windows.</div></div>';
  }
  if(impactedBrands.length||impactedCats.length){
    h+='<div style="margin-top:10px;font-size:11px;color:var(--t2)">';
    if(impactedBrands.length) h+='<strong>Impacted Brands:</strong> '+impactedBrands.map(b=>'<span class="dcc-kh-tag">'+b+'</span>').join('')+' ';
    if(impactedCats.length) h+='<strong>Impacted Categories:</strong> '+impactedCats.map(c=>'<span class="dcc-kh-tag">'+c+'</span>').join('');
    h+='</div>';
  }
  h+='</div></div>';

  // ═══ MODULE 4: DEPARTMENT BOTTLENECK ═══
  h+='<div class="emc-section"><div class="emc-section-hdr"><div class="emc-section-title"><span class="ico">🏢</span> Department Bottleneck</div><span class="emc-section-badge '+(deptBottlenecks.filter(d=>d.pressure!=='ok').length?'red':'green')+'">'+deptBottlenecks.filter(d=>d.pressure!=='ok').length+' under pressure</span></div>';
  h+='<div class="emc-section-body">';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px">';
  deptBottlenecks.forEach(db=>{
    const color=DEPT_COLORS[db.dept]||'#6b7280';
    h+='<div class="emc-dept-card '+db.pressure+'" onclick="S.deptFilter=\''+db.dept+'\';navigateTo(\'dept\')">';
    h+='<div class="emc-dept-name" style="color:'+color+'">'+db.dept+'</div>';
    h+='<div class="emc-dept-stats">';
    h+='<span><span class="emc-dept-stat-val">'+db.impacted+'</span> projects</span>';
    h+='<span><span class="emc-dept-stat-val" style="color:'+(db.overdue?'#f87171':'inherit')+'">'+db.overdue+'</span> overdue</span>';
    h+='<span><span class="emc-dept-stat-val" style="color:'+(db.delayed?'#f87171':'inherit')+'">'+db.delayed+'</span> delayed</span>';
    h+='<span><span class="emc-dept-stat-val">+'+db.avgDelay+'d</span> avg</span>';
    h+='</div>';
    if(db.topRC) h+='<div class="emc-dept-cause">Root cause: '+db.topRC+'</div>';
    if(db.pressure==='overload') h+='<div style="margin-top:6px"><span class="emc-section-badge red">Leadership Support Needed</span></div>';
    h+='</div>';
  });
  h+='</div></div></div>';

  // ═══ MODULE 5: TOP RISK PROJECTS ═══
  const topRisk=[...S.projects].sort((a,b)=>a.healthScore-b.healthScore).slice(0,10);
  h+='<div class="emc-section"><div class="emc-section-hdr"><div class="emc-section-title"><span class="ico">🔴</span> Top Risk Projects</div><span class="emc-section-badge red">Top '+topRisk.length+'</span></div>';
  h+='<div class="emc-section-body">';
  h+='<table class="emc-table"><thead><tr><th>#</th><th>Project</th><th>Brand</th><th>Category</th><th>Gate</th><th>Health</th><th>Delay</th><th>Key Issue</th><th>Owner</th><th></th></tr></thead><tbody>';
  topRisk.forEach((p,i)=>{
    const gate=NPI_GATES[p.currentGate]?.short||'--';
    const hCls=p.healthScore>=70?'hs-high':p.healthScore>=50?'hs-med':'hs-low';
    h+='<tr><td><span class="emc-risk-rank '+(i<1?'r1':i<3?'r2':'')+'">'+(i+1)+'</span></td>';
    h+='<td><span class="pn" onclick="navigateTo(\'projects\',{projectId:\''+p.id+'\'})">'+(p.sku||p.name)+'</span></td>';
    h+='<td>'+(p.brand||'--')+'</td>';
    h+='<td>'+(p.category||p.type||'--')+'</td>';
    h+='<td style="font-size:10px">'+gate+'</td>';
    h+='<td><span class="hs '+hCls+'" style="width:28px;height:28px;font-size:10px;display:inline-grid;place-items:center;border-radius:50%">'+p.healthScore+'</span></td>';
    h+='<td class="num" style="color:'+(p.delayDays>0?'#f87171':'inherit')+'">'+(p.delayDays>0?'+'+p.delayDays+'d':'--')+'</td>';
    h+='<td style="font-size:10px;max-width:150px;overflow:hidden;text-overflow:ellipsis">'+(p.keyIssue||'--')+'</td>';
    h+='<td style="font-size:10px">'+(p.pm||p.owner||'--')+'</td>';
    h+='<td><button class="dcc-action-btn primary" onclick="navigateTo(\'projects\',{projectId:\''+p.id+'\'})">Open</button></td></tr>';
  });
  h+='</tbody></table></div></div>';

  // ═══ MODULE 6: DECISION & ESCALATION CENTER ═══
  const escItems=S.issues.filter(i=>i.status==='Open'&&i.escalation);
  const decItems=S.issues.filter(i=>i.type==='Decision Needed'&&i.status==='Open');
  const allUrgent=[...decItems,...escItems.filter(e=>!decItems.some(d=>d.id===e.id))];

  h+='<div class="emc-section"><div class="emc-section-hdr"><div class="emc-section-title"><span class="ico">⚖️</span> Decision & Escalation Center</div><span class="emc-section-badge '+(allUrgent.length?'red':'green')+'">'+allUrgent.length+' items</span></div>';
  h+='<div class="emc-section-body">';
  if(allUrgent.length){
    allUrgent.forEach(i=>{
      const p=getProject(i.projectId);
      h+='<div class="emc-decision-item">';
      h+='<div class="emc-decision-title">'+(i.type==='Decision Needed'?'⚖️':'🚨')+' '+(i.title||'Untitled')+'</div>';
      h+='<div class="emc-decision-meta">';
      h+='<span>Owner: <strong>'+(i.owner||'--')+'</strong></span>';
      h+='<span>Needed by: <strong>'+fmtShort(i.targetDate)+'</strong></span>';
      h+='<span>Project: '+(p?(p.sku||p.name):'--')+'</span>';
      h+='<span>'+dBadge(i.department)+'</span>';
      h+='</div>';
      if(i.rootCause) h+='<div style="font-size:10px;color:var(--t3);margin-top:3px">Root cause: '+i.rootCause+'</div>';
      if(i.impact||i.delayDays>0) h+='<div class="emc-decision-impact">Impact: '+(i.impact||'+'+i.delayDays+'d delay potential')+'</div>';
      // AI recommended action
      const recAction=i.recoveryAction||'Review and assign decision owner';
      h+='<div style="font-size:10px;color:#60a5fa;margin-top:3px">🤖 AI suggests: '+recAction+'</div>';
      h+='</div>';
    });
  } else {
    h+='<div style="padding:20px;text-align:center;color:var(--t3)"><div style="font-size:28px;margin-bottom:8px">✅</div><div>No pending decisions or escalations.</div></div>';
  }
  h+='</div></div>';

  // ═══ MODULE 7: ROOT CAUSE / RISK PATTERN ═══
  const patterns=[
    {name:'Supplier Issue',icon:'🏭',match:t=>(t.rootCause||'').toLowerCase().includes('supplier')||(t.rootCause||'').toLowerCase().includes('vendor')},
    {name:'Approval Delay',icon:'📝',match:t=>(t.rootCause||'').toLowerCase().includes('approval')||(t.rootCause||'').toLowerCase().includes('sign')},
    {name:'Resource Shortage',icon:'👥',match:t=>(t.rootCause||'').toLowerCase().includes('resource')||(t.rootCause||'').toLowerCase().includes('capacity')||(t.rootCause||'').toLowerCase().includes('shortage')},
    {name:'Certification Delay',icon:'📋',match:t=>(t.rootCause||'').toLowerCase().includes('certif')||(t.rootCause||'').toLowerCase().includes('compliance')},
    {name:'Sample / Tooling Delay',icon:'🔧',match:t=>(t.rootCause||'').toLowerCase().includes('sample')||(t.rootCause||'').toLowerCase().includes('tooling')||(t.rootCause||'').toLowerCase().includes('mold')},
    {name:'Design Freeze Delay',icon:'🎨',match:t=>(t.rootCause||'').toLowerCase().includes('design freeze')||(t.rootCause||'').toLowerCase().includes('design change')||(t.rootCause||'').toLowerCase().includes('ecn')},
    {name:'Process Wait Time',icon:'⏳',match:t=>(t.rootCause||'').toLowerCase().includes('wait')||(t.rootCause||'').toLowerCase().includes('queue')||(t.rootCause||'').toLowerCase().includes('process')}
  ];
  const allDelayedOrBlocked=S.tasks.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const patternCounts=patterns.map(p=>{
    const matches=allDelayedOrBlocked.filter(p.match);
    const totalDelay=matches.reduce((s,t)=>s+(t.delayDays||0),0);
    return{...p,count:matches.length,totalDelay,items:matches};
  }).filter(p=>p.count>0).sort((a,b)=>b.count-a.count);
  // Add unmatched as "Other"
  const matchedIds=new Set(patternCounts.flatMap(p=>p.items.map(t=>t.id)));
  const otherCount=allDelayedOrBlocked.filter(t=>!matchedIds.has(t.id)).length;
  const maxCount=patternCounts.length?patternCounts[0].count:1;

  h+='<div class="emc-section"><div class="emc-section-hdr"><div class="emc-section-title"><span class="ico">🔬</span> Root Cause / Risk Pattern</div><span class="emc-section-badge purple">'+allDelayedOrBlocked.length+' delayed/blocked tasks analyzed</span></div>';
  h+='<div class="emc-section-body">';
  h+='<div class="emc-pattern-grid">';
  patternCounts.forEach(p=>{
    const pct=Math.round(p.count/Math.max(maxCount,1)*100);
    const barColor=p.count>=5?'#ef4444':p.count>=3?'#f59e0b':'#3b82f6';
    h+='<div class="emc-pattern-card">';
    h+='<div class="emc-pattern-name">'+p.icon+' '+p.name+'</div>';
    h+='<div class="emc-pattern-bar"><div class="emc-pattern-bar-fill" style="width:'+pct+'%;background:'+barColor+'"></div></div>';
    h+='<div class="emc-pattern-count"><strong>'+p.count+'</strong> tasks &middot; +'+p.totalDelay+'d total delay</div>';
    h+='</div>';
  });
  if(otherCount>0){
    h+='<div class="emc-pattern-card"><div class="emc-pattern-name">❓ Other / Unspecified</div><div class="emc-pattern-bar"><div class="emc-pattern-bar-fill" style="width:'+Math.round(otherCount/Math.max(maxCount,1)*100)+'%;background:#64748b"></div></div><div class="emc-pattern-count"><strong>'+otherCount+'</strong> tasks</div></div>';
  }
  if(!patternCounts.length&&otherCount===0){
    h+='<div style="padding:16px;text-align:center;color:var(--t3)"><div style="font-size:24px;margin-bottom:6px">✅</div>No systemic risk patterns detected.</div>';
  }
  h+='</div></div></div>';

  // ═══ MODULE 8: AI EXECUTIVE WORKBENCH ═══
  h+='<div class="emc-ai-card"><div class="emc-ai-title">🤖 AI Executive Workbench</div>';
  h+='<div class="emc-ai-text">Portfolio health: <strong>'+avgHealth+'/100</strong>. '+launchDelay.length+' projects with launch impact. '+deptBottlenecks.filter(d=>d.pressure==='overload').length+' department(s) need leadership support. '+decisions.length+' pending decision(s).</div>';
  h+='<div class="emc-ai-actions">';
  h+='<button class="emc-ai-btn" onclick="emcShowAI(this,\'summary\')">📋 Executive Summary</button>';
  h+='<button class="emc-ai-btn" onclick="emcShowAI(this,\'risk\')">⚠️ Explain Portfolio Risk</button>';
  h+='<button class="emc-ai-btn" onclick="emcShowAI(this,\'bottleneck\')">🔍 Identify Top Bottlenecks</button>';
  h+='<button class="emc-ai-btn" onclick="emcShowAI(this,\'actions\')">🎯 Recommend Leadership Actions</button>';
  h+='<button class="emc-ai-btn" onclick="emcShowAI(this,\'escalation\')">📢 Draft Escalation Note</button>';
  h+='<button class="emc-ai-btn" onclick="emcShowAI(this,\'weekly\')">📊 Weekly Business Review</button>';
  h+='<button class="emc-ai-btn" onclick="emcShowAI(this,\'predict\')">🔮 Predict 30-Day Risk</button>';
  h+='</div><div class="emc-ai-result" id="emc-ai-result"></div></div>';

  h+='</div>'; // end emc-root
  c.innerHTML=h;
}

/* EMC AI Workbench handler */
function emcShowAI(btn,type){
  const resultEl=btn.closest('.emc-ai-card').querySelector('.emc-ai-result');
  if(resultEl.classList.contains('show')&&resultEl.dataset.type===type){resultEl.classList.remove('show');return;}
  let html='';
  const total=S.projects.length;
  const onTrack=S.projects.filter(p=>p.healthScore>=70);
  const atRisk=S.projects.filter(p=>p.healthScore>=50&&p.healthScore<70);
  const critical=S.projects.filter(p=>p.healthScore<50);
  const avgHealth=total?Math.round(S.projects.reduce((s,p)=>s+p.healthScore,0)/total):0;
  const delayedTasks=S.tasks.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const overdueTasks=S.tasks.filter(t=>isOverdue(t.dueDate,t.status));
  const decisions=S.issues.filter(i=>i.type==='Decision Needed'&&i.status==='Open');
  const openEsc=S.issues.filter(i=>i.status==='Open'&&i.escalation);
  const deptBN=DEPARTMENTS.map(d=>{
    const dt=S.tasks.filter(t=>t.department===d);
    const dd=dt.filter(t=>t.status==='Delayed'||t.status==='Blocked');
    return{dept:d,delayed:dd.length,totalDelay:dd.reduce((s,t)=>s+(t.delayDays||0),0)};
  }).sort((a,b)=>b.totalDelay-a.totalDelay);

  if(type==='summary'){
    html+='<strong>📋 Executive Summary</strong>';
    html+='<div style="margin-top:6px">AutoPM portfolio tracks <strong>'+total+' projects</strong> ('+REAL_DEPT_STATS.active+' active SKUs). Health score: <strong>'+avgHealth+'/100</strong>.</div>';
    html+='<div style="margin-top:4px">'+onTrack.length+' on track, '+atRisk.length+' at risk, <span class="hi-red">'+critical.length+' critical</span>.</div>';
    html+='<div style="margin-top:4px">'+delayedTasks.length+' delayed/blocked tasks, '+overdueTasks.length+' overdue. '+decisions.length+' pending decisions.</div>';
    if(openEsc.length) html+='<div style="margin-top:4px"><span class="hi-red">'+openEsc.length+' escalated issues</span> awaiting executive action.</div>';
  } else if(type==='risk'){
    html+='<strong>⚠️ Portfolio Risk Analysis</strong>';
    const topRisk=[...S.projects].sort((a,b)=>a.healthScore-b.healthScore).slice(0,5);
    html+='<div style="margin-top:6px">';
    topRisk.forEach((p,i)=>{
      html+='<div style="margin-bottom:6px"><strong>'+(i+1)+'. '+(p.sku||p.name)+'</strong> — Health: '+p.healthScore+(p.delayDays>0?', +'+p.delayDays+'d':'')+' — '+(p.keyIssue||'Key issue TBD')+'</div>';
    });
    html+='</div>';
    if(critical.length>0) html+='<div style="margin-top:4px"><span class="hi-red">'+critical.length+' projects below health threshold 50</span> — immediate intervention needed.</div>';
  } else if(type==='bottleneck'){
    html+='<strong>🔍 Top Bottleneck Analysis</strong>';
    html+='<div style="margin-top:6px">';
    deptBN.filter(d=>d.totalDelay>0).slice(0,5).forEach(db=>{
      html+='<div style="margin-bottom:6px"><strong>'+db.dept+'</strong>: +'+db.totalDelay+'d total delay across '+db.delayed+' tasks. ';
      if(db.pressure==='overload'||db.delayed>3) html+='<span class="hi-red">Leadership support required.</span>';
      html+='</div>';
    });
    if(!deptBN.some(d=>d.totalDelay>0)) html+='<span class="hi-green">No department bottlenecks detected.</span>';
    html+='</div>';
  } else if(type==='actions'){
    html+='<strong>🎯 Recommended Leadership Actions</strong>';
    html+='<div style="margin-top:6px">';
    if(critical.length) html+='<div style="margin-bottom:6px"><span class="hi-red">1. Urgent:</span> Review '+critical.length+' critical project(s): '+critical.map(p=>p.sku||p.name).join(', ')+'.</div>';
    if(decisions.length) html+='<div style="margin-bottom:6px"><span class="hi-orange">2. Decision:</span> Resolve '+decisions.length+' pending decision(s) — each blocks downstream progress.</div>';
    if(deptBN[0]&&deptBN[0].totalDelay>10) html+='<div style="margin-bottom:6px"><span class="hi-orange">3. Resource:</span> Provide additional support to '+deptBN[0].dept+' department (+ '+deptBN[0].totalDelay+'d cumulative delay).</div>';
    if(openEsc.length) html+='<div style="margin-bottom:6px"><span class="hi-red">4. Escalation:</span> Respond to '+openEsc.length+' escalated issue(s).</div>';
    if(!critical.length&&!decisions.length) html+='<span class="hi-green">No immediate leadership actions required. Portfolio is stable.</span>';
    html+='</div>';
  } else if(type==='escalation'){
    html+='<strong>📢 Escalation Note Draft</strong>';
    html+='<div style="margin-top:6px;font-size:11px;line-height:1.5">';
    html+='<div><strong>To:</strong> VP Product Development / GM</div>';
    html+='<div><strong>From:</strong> PMO — AutoPM Executive Alert</div>';
    html+='<div><strong>Subject:</strong> Portfolio Risk Alert — '+critical.length+' Critical, '+atRisk.length+' At Risk</div>';
    html+='<div style="margin-top:8px"><strong>Summary:</strong> Portfolio health score at <strong>'+avgHealth+'/100</strong>. '+delayedTasks.length+' tasks delayed/blocked across '+deptBN.filter(d=>d.delayed>0).length+' departments.</div>';
    if(critical.length) html+='<div style="margin-top:4px"><strong>Critical projects:</strong> '+critical.map(p=>p.sku+' (H:'+p.healthScore+')').join(', ')+'</div>';
    if(openEsc.length) html+='<div style="margin-top:4px"><strong>Escalated issues:</strong> '+openEsc.map(i=>i.title).slice(0,3).join('; ')+'</div>';
    html+='<div style="margin-top:8px"><strong>Requested Action:</strong> Leadership review within 24h to unblock critical path items.</div>';
    html+='</div>';
  } else if(type==='weekly'){
    const doneThisWeek=S.tasks.filter(t=>t.status==='Done').length;

    html+='<div><strong>Decisions:</strong> '+decisions.length+' pending executive decisions.</div>';
    html+='<div style="margin-top:6px"><strong>Next Week Focus:</strong> ';

    if(decisions.length) html+='Clear '+decisions.length+' pending decisions. ';
    if(!critical.length&&!decisions.length) html+='Continue monitoring and proactive risk mitigation.';
    html+='</div></div>';
  } else if(type==='predict'){
    html+='<strong>🔮 30-Day Risk Prediction</strong>';
    html+='<div style="margin-top:6px">';
    const highRisk=S.projects.filter(p=>p.healthScore<60&&p.status!=='Completed');
    if(highRisk.length){
      html+='<div style="margin-bottom:6px"><span class="hi-red">'+highRisk.length+' project(s) likely to miss next milestone</span> within 30 days:</div>';
      highRisk.slice(0,5).forEach(p=>{
        html+='<div style="margin-bottom:4px;margin-left:12px">• <strong>'+(p.sku||p.name)+'</strong> — Health: '+p.healthScore+', +'+p.delayDays+'d delay, Gate: '+(NPI_GATES[p.currentGate]?.short||'--')+'</div>';
      });
    }
    const deptWatch=deptBN.filter(d=>d.delayed>=2);
    if(deptWatch.length){
      html+='<div style="margin-top:6px"><span class="hi-orange">Departments at risk of further delays:</span> '+deptWatch.map(d=>d.dept+' ('+d.delayed+' delayed)').join(', ')+'</div>';
    }
    if(!highRisk.length&&!deptWatch.length) html+='<span class="hi-green">No significant risks predicted for the next 30 days. Portfolio trajectory is stable.</span>';
    html+='</div>';
  }

  resultEl.innerHTML=html;
  resultEl.classList.add('show');
  resultEl.dataset.type=type;
}

function renderKnowledge(c){

  let filtered=S.knowledge.filter(k=>{
    const q=search.toLowerCase();
    const matchSearch=!q||(k.title+k.tags?.join('')+k.problem+k.solution).toLowerCase().includes(q);
    const matchType=!kbType||k.type===kbType;

  let h=`<div class="filter-bar mb16">

      <div class="ai-text">Found <strong>${filtered.length} items</strong> matching your query.

  if(!S.knowledge.length){
    h+=`<div class="card"><div class="card-body" style="text-align:center;padding:40px 20px;color:var(--t3)">
      <div style="font-size:32px;margin-bottom:12px">📚</div>

        <div class="flex justify-between items-center mb4">
          <span class="badge ${k.type==='Lesson Learned'?'ba':k.type==='Best Practice'?'bg':'bb'}">${k.type}</span>
          <span class="text-xs text-muted">${k.date}</span>

function saveEditTask(tid){
  const t=S.tasks.find(x=>x.id===tid);if(!t)return;
  const newStatus=document.getElementById('et_status')?.value||t.status;
  const isDelayed=newStatus==='Delayed'||newStatus==='Blocked';
  if(isDelayed){
    const root=document.getElementById('et_root')?.value?.trim();
    const rec=document.getElementById('et_rec')?.value?.trim();
    if(!root||!rec){toast('Root Cause and Recovery Action are required for Delayed/Blocked tasks','error');return;}
  }
  t.name=document.getElementById('et_name')?.value||t.name;
  t.owner=document.getElementById('et_owner')?.value||t.owner;
  t.start=document.getElementById('et_start')?.value||t.start;
  t.dueDate=document.getElementById('et_due')?.value||t.dueDate;
  t.status=newStatus;
  t.pri=document.getElementById('et_pri')?.value||t.pri;
  t.ms=document.getElementById('et_ms')?.value||t.ms;
  t.delayDays=parseInt(document.getElementById('et_dd')?.value||0);
  t.rootCause=document.getElementById('et_root')?.value||'';
  t.recoveryAction=document.getElementById('et_rec')?.value||'';
  t.recoveryOwner=document.getElementById('et_recown')?.value||'';
  t.targetRecoveryDate=document.getElementById('et_recdate')?.value||'';
  t.impactedMs=document.getElementById('et_impms')?.value||'';
  t.escalation=document.getElementById('et_esc')?.checked||false;
  t.actionNote=document.getElementById('et_note')?.value||'';
  t.delayFlag=t.delayDays>0;
  t.riskFlag=t.status==='At Risk'||t.status==='Delayed'||t.status==='Blocked';
  // Sync project
  const proj=getProject(t.projectId);
  if(proj){
    if(isDelayed&&t.delayDays>0){proj.delayDays=Math.max(proj.delayDays||0,t.delayDays);proj.riskLevel='High';}
    if(t.recoveryAction)proj.recoveryAction=t.recoveryAction;
    if(t.rootCause)proj.keyIssue=(t.name||'').slice(0,40)+(t.delayDays>0?` +${t.delayDays}d`:'');
    const allTasks=projTasks(t.projectId);
    const blocked=allTasks.filter(x=>x.status==='Blocked').length;
    const delayed=allTasks.filter(x=>x.status==='Delayed').length;
    const done=allTasks.filter(x=>x.status==='Done').length;
    const health=Math.max(10,100-blocked*20-delayed*10-Math.max(0,(allTasks.length-done-blocked-delayed)*2));
    proj.healthScore=health;
    proj.status=blocked>0?'Blocked':delayed>0?'At Risk':proj.status;
  }
  closeModal();saveData();render();toast('Task saved');
}

function saveEditProjectStatus(pid){
  const p=getProject(pid);
  if(!p){toast('Project not found','error');return;}
  const status=document.getElementById('eps_status')?.value||p.status;
  const riskLevel=document.getElementById('eps_risk')?.value||p.riskLevel;
  const healthRaw=parseInt(document.getElementById('eps_health')?.value??p.healthScore);
  const healthScore=Math.max(0,Math.min(100,isNaN(healthRaw)?p.healthScore:healthRaw));
  const gateRaw=parseInt(document.getElementById('eps_gate')?.value??p.currentGate);
  const currentGate=isNaN(gateRaw)?p.currentGate:gateRaw;
  const targetLaunch=document.getElementById('eps_launch')?.value||p.targetLaunch;
  const pmEl=document.getElementById('eps_pm');
  const keyIssue=document.getElementById('eps_issue')?.value??p.keyIssue;
  const recoveryAction=document.getElementById('eps_recovery')?.value??p.recoveryAction;
  const nextMs=document.getElementById('eps_nextms')?.value??p.nextMs;
  if((status==='Delayed'||status==='Blocked')&&(!keyIssue?.trim()||!recoveryAction?.trim())){
    toast('Warning: Key Issue and Recovery Action are recommended for Delayed/Blocked status','error');
  }
  p.status=status;
  p.riskLevel=riskLevel;
  p.healthScore=healthScore;
  p.currentGate=currentGate;
  p.targetLaunch=targetLaunch;
  if(pmEl)p.pm=pmEl.value;
  p.keyIssue=keyIssue;
  p.recoveryAction=recoveryAction;
  p.nextMs=nextMs;
  p.updatedAt=new Date().toISOString();
  p.updatedBy='Sunny';
  closeModal();
  saveData();
  render();
  toast('Project status updated');
}

function changeStatus(tid,newSt){
  const t=S.tasks.find(x=>x.id===tid);if(!t)return;

function pdWorkflow(p){
  const wfNames=['Award','Kick Off','ECN Open','ECN DD','EB Build','Sample & Test','ECN IMP','MP'];
  let h=`<div class="pd-workflow"><div class="pd-wf-title">PROJECT WORKFLOW</div><div class="pd-wf-bar">`;
  NPI_GATES.forEach((g,i)=>{
    const gs=p.gates[i]||{};const st=gs.status||'Not Started';
    const cls={'Done':'wf-done','In Progress':'wf-ip','At Risk':'wf-risk','Delayed':'wf-delay','Blocked':'wf-blocked','Not Started':'wf-ns'}[st]||'wf-ns';
    const isCur=i===p.currentGate;
    const pct=gs.completion||0;
    h+=`<div class="pd-wf-stage ${isCur?'wf-cur':''}" title="${g.name}: ${st} (${pct}%)">
      <div class="pd-wf-dot ${cls}">${st==='Done'?'✓':pct>0?'▶':'○'}</div>
      <div class="pd-wf-name">${wfNames[i]||g.short}</div>
      <div class="pd-wf-date">${gs.actualDate?fmtShort(gs.actualDate):gs.targetDate?fmtShort(gs.targetDate):'—'}</div>
      ${(st==='Delayed'||st==='Blocked')?`<div style="font-size:9px;color:var(--red);font-weight:700">⚠ ${st}</div>`:''}
    </div>`;
  });
  h+=`</div></div>`;
  return h;
}

function pdSummaryCards(p,tasks,issues,delivs){
  const openT=tasks.filter(t=>t.status!=='Done'&&t.status!=='Completed');
  const delayedT=tasks.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const openI=issues.filter(i=>i.status==='Open');

/* ===== OVERRIDE pdTabBar: add Team + Gantt ===== */
function pdTabBar(tab){
  const tabs=[
    ['overview','Overview'],
    ['team','Team Members'],
    ['tasks','Tasks'],
    ['gantt','Gantt Chart'],
    ['risks','Risks'],
    ['decisions','Decisions'],
    ['dependencies','Dependencies'],
    ['documents','Documents'],
    ['ai','AI Analysis']
  ];
  return `<div class="pd-tab-bar">${tabs.map(([k,l])=>`<button class="pd-tab ${tab===k?'active':''}" onclick="S.subPage='${k}';render()">${l}</button>`).join('')}</div>`;
}

/* ===== OVERRIDE pdTabContent ===== */
function pdTabContent(tab,p,tasks,issues,delivs){
  if(tab==='overview')return pdOverview(p,tasks,issues,delivs);
  if(tab==='team')return pdTeamTab(p);
  if(tab==='tasks')return pdTasksTab(p,tasks);
  if(tab==='gantt')return pdGanttTab(p,tasks);
  if(tab==='risks')return pdRisksTab(p,issues);
  if(tab==='decisions')return pdDecisionsTab(p,issues);
  if(tab==='dependencies')return pdDepsTab(p);
  if(tab==='documents')return pdDocsTab(p);
  if(tab==='ai')return pdAITab(p,tasks,issues);
  return pdOverview(p,tasks,issues,delivs);
}

/* ===== GANTT CHART TAB ===== */
function pdGanttTab(p,tasks){
  if(!tasks || !tasks.length) return `<div style="padding:40px;text-align:center;color:var(--t3)">No tasks to display in Gantt chart.</div>`;

  // Compute date range: project start → targetLaunch, with task padding
  const pStart=new Date(p.start+'T00:00:00');
  const pEnd=new Date(p.targetLaunch+'T00:00:00');
  // Expand range by 15 days each side
  const rangeStart=new Date(pStart); rangeStart.setDate(rangeStart.getDate()-15);
  const rangeEnd=new Date(pEnd); rangeEnd.setDate(rangeEnd.getDate()+30);
  const totalDays=Math.max(1,(rangeEnd-rangeStart)/(86400000));

  // Today marker
  const today=new Date(); const todayPct=Math.max(0,Math.min(100,(today-rangeStart)/86400000/totalDays*100));

  // Build month headers
  const months=[];
  const cur=new Date(rangeStart.getFullYear(),rangeStart.getMonth(),1);
  while(cur<=rangeEnd){
    const msStart=new Date(cur);
    const msEnd=new Date(cur.getFullYear(),cur.getMonth()+1,0);
    const leftPct=(msStart-rangeStart)/86400000/totalDays*100;
    const widthPct=(msEnd-msStart+86400000)/86400000/totalDays*100;
    months.push({label:cur.toLocaleString('en',{month:'short',year:'2-digit'}),leftPct,widthPct});
    cur.setMonth(cur.getMonth()+1);
  }

  // Task rows
  const getTaskPos=task=>{
    const s=new Date((task.start||p.start)+'T00:00:00');
    const d=new Date((task.dueDate||task.due||p.targetLaunch)+'T00:00:00');
    const left=Math.max(0,(s-rangeStart)/86400000/totalDays*100);
    const w=Math.max(1,(d-s)/86400000/totalDays*100);
    return {left,width:w};
  };
  const statusClass=t=>{
    if(t.status==='Done'||t.prog>=100)return'done';
    if(t.status==='In Progress'||t.status==='IP')return'ip';
    if(t.status==='At Risk')return'risk';
    if(t.status==='Delayed'||t.status==='Blocked')return t.status==='Delayed'?'delay':'blocked';
    return'ns';
  };

  let h=`<div class="pd-gantt-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span class="fw6" style="font-size:14px">Gantt Chart — ${p.sku}</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-xs" onclick="toast('Zoom to fit coming soon')">Fit View</button>
        <button class="btn btn-primary btn-sm" onclick="showNewTaskModal('${p.id}')">+ Add Task</button>
      </div>
    </div>`;

  // Legend
  h+=`<div class="pd-gantt-legend">
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--green)"></div> Done</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--blue)"></div> In Progress</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--amber)"></div> At Risk</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--red)"></div> Delayed</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--darkred)"></div> Blocked</div>
    <div class="pd-gantt-legend-i"><div class="pd-gantt-legend-dot" style="background:var(--border)"></div> Not Started</div>
  </div>`;

  h+=`<div class="pd-gantt-chart">`;

  // Header
  h+=`<div class="pd-gantt-header">
    <div class="pd-gantt-h-label">Task Name</div>
    <div class="pd-gantt-h-months">${months.map(m=>`<div class="pd-gantt-h-month" style="left:${m.leftPct}%;width:${m.widthPct}%">${m.label}</div>`).join('')}</div>
  </div>`;

  // Grid: add vertical grid lines
  h+=`<div style="position:relative">`;
  months.forEach(m=>{
    h+=`<div class="pd-gantt-gridline" style="left:${m.leftPct}%"></div>`;
  });

  // Today marker
  h+=`<div class="pd-gantt-today" style="left:${todayPct}%"><div class="pd-gantt-today-label">TODAY</div></div>`;

  // Task rows
  tasks.forEach(t=>{
    const pos=getTaskPos(t);
    const cls=statusClass(t);
    const prog=Math.max(0,Math.min(100,t.prog||0));
    h+=`<div class="pd-gantt-row">
      <div class="pd-gantt-task-name" title="${t.name}">${t.name}</div>
      <div class="pd-gantt-timeline">
        <div class="pd-gantt-bar ${cls}" style="left:${pos.left}%;width:${pos.width}%" title="${t.name}: ${fmtShort(t.start)} → ${fmtShort(t.dueDate||t.due)} (${prog}%)">
          <span style="font-size:9px;opacity:.9">${prog}%</span>
        </div>
      </div>
    </div>`;
  });

  h+=`</div></div></div>`;
  return h;
}

/* AI content generators */
function dccGenBottleneck(dept, deptTasks, deptProjects){
  const delayed = deptTasks.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const overloaded = {};
  deptTasks.filter(t=>t.status!=='Done'&&t.status!=='Completed').forEach(t=>{
    if(!overloaded[t.owner]) overloaded[t.owner]={count:0,critical:0,projects:new Set()};
    overloaded[t.owner].count++;
    if(t.pri==='high') overloaded[t.owner].critical++;
    if(t.projectId) overloaded[t.owner].projects.add(t.projectId);
  });
  const topOverloaded = Object.entries(overloaded).sort((a,b)=>b[1].count-a[1].count)[0];
  const topDelayed = deptProjects.filter(p=>p.delayDays>0).sort((a,b)=>b.delayDays-a.delayDays)[0];
  const gateRisks = {};
  deptTasks.filter(t=>t.status==='Delayed'||t.status==='Blocked').forEach(t=>{
    const g = NPI_GATES[t.gate]?.name||'Unknown';
    if(!gateRisks[g]) gateRisks[g]=0;
    gateRisks[g]++;
  });
  const topGate = Object.entries(gateRisks).sort((a,b)=>b[1]-a[1])[0];

  let html = '<div style="margin-top:6px">';
  if(topDelayed) html += '<div><strong>Project Bottleneck:</strong> <span class="hi-red">'+topDelayed.sku+'</span> — '+topDelayed.keyIssue+' (+'+topDelayed.delayDays+'d delay). '+topDelayed.recoveryAction+'</div>';
  if(topOverloaded && topOverloaded[1].count>2) html += '<div style="margin-top:4px"><strong>Resource Bottleneck:</strong> <span class="hi-amber">'+topOverloaded[0]+'</span> has '+topOverloaded[1].count+' open tasks ('+topOverloaded[1].critical+' critical) across '+topOverloaded[1].projects.size+' projects.</div>';
  if(topGate) html += '<div style="margin-top:4px"><strong>Gate Risk:</strong> <span class="hi-red">'+topGate[0]+'</span> has '+topGate[1]+' delayed/blocked tasks — highest risk gate for '+dept+'.</div>';
  if(!topDelayed && (!topOverloaded||topOverloaded[1].count<=2)) html += '<div><span class="hi-green">No critical bottlenecks detected.</span> Department operating within normal parameters.</div>';
  html += '</div>';
  return html;
}

function dccGenPriority(dept, deptTasks){
  const active = deptTasks.filter(t=>t.status!=='Done'&&t.status!=='Completed');
  const prioritized = active.sort((a,b)=>{
    const priScore = {high:0,medium:1,low:2};
    const stScore = {'Blocked':0,'Delayed':1,'At Risk':2,'In Progress':3,'Not Started':4};
    return (priScore[a.pri]||2)-(priScore[b.pri]||2) || (stScore[a.status]||4)-(stScore[b.status]||4) || (b.delayDays||0)-(a.delayDays||0);
  }).slice(0,5);
  if(!prioritized.length) return '<div><span class="hi-green">All tasks completed. No immediate priorities.</span></div>';
  let html = '';
  prioritized.forEach((t,i)=>{
    const p = S.projects.find(x=>x.id===t.projectId);
    html += '<div style="margin-top:4px;padding:4px 8px;background:rgba(139,92,246,0.05);border-radius:4px;border-left:2px solid '+(i===0?'#ef4444':i<3?'#f59e0b':'#6b7280')+'">';
    html += '<strong>#'+(i+1)+'</strong> '+(p?p.sku+' — ':'')+t.name;
    html += ' <span style="font-size:9px;color:#94a3b8">('+(t.status)+', '+(t.pri)+' priority'+(t.delayDays>0?', +'+t.delayDays+'d delay':'')+')</span>';
    if(t.recoveryAction) html += '<div style="font-size:10px;color:#94a3b8;margin-top:1px">Action: '+t.recoveryAction+'</div>';
    html += '</div>';
  });
  return html;
}

function dccGenForecast(dept, deptTasks, deptProjects){
  const delayed = deptTasks.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const atRisk = deptTasks.filter(t=>t.status==='At Risk');
  const highRiskProjs = deptProjects.filter(p=>p.riskLevel==='High');
  let html = '<div>';
  if(delayed.length) html += '<div><span class="hi-red">'+delayed.length+' delayed/blocked tasks</span> — if unresolved, launch delays of <strong>'+Math.max(...delayed.map(t=>t.delayDays||0),0)+'+ days</strong> possible.</div>';
  if(atRisk.length) html += '<div style="margin-top:4px"><span class="hi-amber">'+atRisk.length+' tasks at risk</span> — may escalate to delayed in next 1-2 weeks.</div>';
  if(highRiskProjs.length) html += '<div style="margin-top:4px"><strong>High-risk projects:</strong> '+highRiskProjs.map(p=>'<span class="hi-red">'+p.sku+'</span>').join(', ')+' — require management attention.</div>';
  const next2w = deptTasks.filter(t=>t.dueDate&&t.status!=='Done'&&new Date(t.dueDate+'T00:00:00')<=new Date(Date.now()+14*86400000));
  if(next2w.length) html += '<div style="margin-top:4px"><strong>Next 2 weeks:</strong> '+next2w.length+' tasks due — '+next2w.filter(t=>t.pri==='high').length+' are high priority.</div>';
  if(!delayed.length&&!atRisk.length) html += '<span class="hi-green">No significant risks forecasted for next 2-4 weeks.</span>';
  html += '</div>';
  return html;
}

function dccGenEscalation(dept, deptTasks, deptProjects){
  const escalated = deptTasks.filter(t=>t.escalation);
  const esclist = DCC_ESCALATIONS[dept]||[];
  if(!escalated.length && !esclist.length) return '<div><span class="hi-green">No escalations needed at this time.</span></div>';
  let html = '';
  escalated.forEach(t=>{
    const p = S.projects.find(x=>x.id===t.projectId);
    html += '<div style="margin-top:4px;padding:6px 10px;background:rgba(239,68,68,0.06);border-radius:4px;border-left:3px solid #ef4444">';
    html += '<strong>'+(p?p.sku:'—')+'</strong>: '+t.name;
    html += '<div style="font-size:10px;color:#94a3b8;margin-top:2px">Recovery: '+t.recoveryAction+' | Owner: '+t.recoveryOwner+'</div>';
    html += '</div>';
  });
  esclist.forEach(e=>{
    html += '<div style="margin-top:4px;padding:6px 10px;background:rgba(239,68,68,0.06);border-radius:4px;border-left:3px solid #ef4444">';
    html += '<strong>Decision needed:</strong> '+e.decision;
    html += '<div style="font-size:10px;color:#94a3b8;margin-top:2px">Project: '+e.project+' | By: '+e.neededBy+' | Impact: '+e.impact+'</div>';
    html += '</div>';
  });
  return html;
}

function dccGenResource(dept, deptTasks, deptUsers){
  const overloaded = [];
  deptUsers.forEach(u=>{
    const ut = deptTasks.filter(t=>t.owner===u.name&&t.status!=='Done'&&t.status!=='Completed');
    const crit = ut.filter(t=>t.pri==='high').length;
    const overdue = ut.filter(t=>isOverdue(t.dueDate,t.status)).length;
    const projs = [...new Set(ut.map(t=>t.projectId))].length;
    if(ut.length>2 || crit>0 || overdue>0){
      overloaded.push({name:u.name,open:ut.length,critical:crit,overdue,projects:projs});
    }
  });
  const noOwner = deptTasks.filter(t=>(!t.owner||t.owner==='Unassigned')&&t.status!=='Done'&&t.status!=='Completed');
  let html = '<div>';
  if(overloaded.length){
    html += '<div style="margin-top:4px"><strong>Overloaded resources:</strong></div>';
    overloaded.forEach(o=>{
      html += '<div style="margin-top:2px;padding:2px 6px;background:rgba(245,158,11,0.05);border-radius:3px"><span class="hi-amber">'+o.name+'</span>: '+o.open+' open ('+o.critical+' critical, '+o.overdue+' overdue) across '+o.projects+' projects</div>';
    });
  }
  if(noOwner.length) html += '<div style="margin-top:4px"><span class="hi-red">'+noOwner.length+' tasks have no owner assigned.</span></div>';
  const competing = {};
  deptTasks.filter(t=>t.owner&&t.status!=='Done').forEach(t=>{
    if(!competing[t.owner]) competing[t.owner]=new Set();
    competing[t.owner].add(t.projectId);
  });
  const conflicts = Object.entries(competing).filter(([k,v])=>v.size>1);
  if(conflicts.length) html += '<div style="margin-top:4px"><strong>Resource conflicts:</strong> '+conflicts.map(([n,ps])=>n+' ('+ps.size+' projects)').join(', ')+'</div>';
  if(!overloaded.length&&!noOwner.length&&!conflicts.length) html += '<span class="hi-green">Resources are balanced. No rebalancing needed.</span>';
  html += '</div>';
  return html;
}

function renderDeptView(dept){
  const cfg=getDeptConfig(dept);
  const deptName=cfg?cfg.name:dept;
  const leader=cfg?cfg.leader:'--';
  const leaderRole=cfg?cfg.role:'--';
  
  // Department tasks - try both new ID and legacy name matching
  const deptTasks=S.tasks.filter(t=>t.department===dept||t.department===deptName||(DEPT_ALIAS[t.department]===dept));
  const deptProjects=S.projects.filter(p=>deptTasks.some(t=>t.projectId===p.id));
  const deptUsers=S.users.filter(u=>u.dept===dept||u.dept===deptName);
  const openT=deptTasks.filter(t=>t.status!=='Done'&&t.status!=='Completed');
  const overdueT=deptTasks.filter(t=>isOverdue(t.dueDate,t.status));
  const delayedT=deptTasks.filter(t=>t.status==='Delayed'||t.status==='Blocked');
  const riskProjects=deptProjects.filter(p=>p.riskLevel==='High');
  
  // === PEOPLE WORKLOAD ===
  const ownerWL={};
  deptUsers.forEach(u=>{
    const ut=deptTasks.filter(t=>t.owner===u.name);
    const op=ut.filter(t=>t.status!=='Done'&&t.status!=='Completed');
    const crit=op.filter(t=>t.pri==='high');
    const od=op.filter(t=>isOverdue(t.dueDate,t.status));
    const projs=[...new Set(op.map(t=>t.projectId))];
    const capScore=op.length*1+crit.length*2+od.length*3+(projs.length>1?projs.length:0);
    const capStatus=capScore>10?'overload':capScore>5?'high':'ok';
    ownerWL[u.name]={user:u,role:u.role,open:op.length,critical:crit.length,overdue:od.length,total:ut.length,projects:projs.length,capScore,capStatus};
  });
  const overloadedCount=Object.values(ownerWL).filter(o=>o.capStatus==='overload').length;
  const highLoadCount=Object.values(ownerWL).filter(o=>o.capStatus==='high').length;
  const pressureCount=overloadedCount+highLoadCount;
  
  // === HEALTH SCORE (composite) ===
  const hRiskPenalty=riskProjects.length*15;
  const overduePenalty=overdueT.length*10;
  const delayPenalty=delayedT.length*8;
  const noRecovery=delayedT.filter(t=>!t.recoveryAction&&t.status!=='Done').length;
  const noRecoveryPenalty=noRecovery*12;
  const overloadPenalty=overloadedCount*10;
  const launchImpact=deptProjects.filter(p=>p.riskLevel==='High'&&p.launchDate).length;
  const launchPenalty=launchImpact*8;
  const rawHealth=Math.max(0,100-hRiskPenalty-overduePenalty-delayPenalty-noRecoveryPenalty-overloadPenalty-launchPenalty);
  const healthScore=Math.min(100,Math.max(0,rawHealth));
  const scoreCls=healthScore>=70?'s-good':healthScore>=50?'s-warn':'s-bad';
  
  // Build "Why this score?" explanation
  let whyParts=[];
  if(riskProjects.length>0) whyParts.push(riskProjects.length+' project'+(riskProjects.length>1?'s are':' is')+' high risk');
  if(overdueT.length>0) whyParts.push(overdueT.length+' task'+(overdueT.length>1?'s are':' is')+' overdue');
  if(delayedT.length>0) whyParts.push(delayedT.length+' task'+(delayedT.length>1?'s are':' is')+' delayed/blocked');
  if(noRecovery>0) whyParts.push(noRecovery+' delayed task'+(noRecovery>1?'s have':' has')+' no recovery action');
  if(overloadedCount>0) whyParts.push(overloadedCount+' staff member'+(overloadedCount>1?'s are':' is')+' overloaded');
  if(launchImpact>0) whyParts.push(launchImpact+' project'+(launchImpact>1?'s may':' may')+' impact launch');
  const whyText=whyParts.length?'Health score is '+scoreCls.replace('s-good','good').replace('s-warn','warning').replace('s-bad','critical')+' because '+whyParts.join(', ')+'.':'All systems operational — no risk factors detected.';
  
  // Department color
  const deptColor=DEPT_COLORS[dept]||'#6b7280';
  
  let h='<div class="dcc-root">';

  h+='</div>';

  h+='<div class="dcc-hb-stat"><div class="dcc-hb-stat-val '+(riskProjects.length?'red':'green')+'">'+riskProjects.length+'</div><div class="dcc-hb-stat-label">High Risk Projects</div></div>';

  h+=whyText;
