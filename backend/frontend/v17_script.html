
<!-- ========== v17.0 Four-Layer Architecture JS ========== -->
<script>
// ============================================================
// v17.0 State
// ============================================================
let v16CurrentLevel = 'L1';
let v16CurrentTab = 'Dashboard';
let v16Initialized = false;
window._v17L4Project = null;
window._v17L3Owner = null;
window._v17AIChatOpen = false;
window._v17AIChatHistory = [];
window._v17Blockers = [];

// Color system v17.0
const C = {critical:'#FF4444',atRisk:'#FFAA00',onTrack:'#00CC66',info:'#888888',blue:'#3b82f6',purple:'#818cf8'};

// Tab definitions per level (v17.0)
const V16_TABS = {
  L1: ['Dashboard', 'Pipeline', 'Analytics', 'AI Brief'],
  L2: ['Overview', 'Projects', 'Team', 'AI Advisor'],
  L3: ['My Work', 'AI Daily'],
  L4: ['Overview', 'Tasks', 'AI Copilot', 'Workflow', 'Document', 'Team'],
  LD: ['Documents']
};

// AI contextual hints per level/context
const AI_HINTS = {
  L1: [
    'Based on current trends, 3 more projects will enter At Risk within 2 weeks. Recommend reviewing SC capacity now.',
    'SC has been #1 risk department for 3 weeks. Root cause: 2 unfilled positions.',
    'Portfolio health is trending down. Compliance bottleneck accounts for 35% of delays.'
  ],
  L2: [
    'Moving 1 engineer from ID to EE would unblock 4 projects at G3-G4.',
    'Your G2 approval averages 12 days. Industry benchmark: 5 days.',
    'PMO utilization at 87% — consider redistributing 2 projects to NPI.'
  ],
  L3: [
    'Do PCB approval first — it is blocking 2 downstream tasks.',
    'This task has been In Progress for 8 days. Average is 3 days. Need help?',
    'You are the bottleneck on 3 projects. Focus on P0 items first.'
  ],
  L4: [
    '3 similar EE blockers were resolved by escalating to VP. Suggest escalation?',
    'Fastest path to MP: if DQTP completes by Jul 10, you can save 2 weeks.',
    'This task is on the critical path. Any delay pushes MP date.'
  ]
};

function aiHint(level) {
  var hints = AI_HINTS[level] || AI_HINTS.L1;
  return hints[Math.floor(Math.random() * hints.length)];
}

function aiBubble(text) {
  return '<div style="margin:8px 0;padding:8px 12px;background:#1a1a2e;border:1px solid #7c3aed33;border-radius:8px;font-size:12px;color:#c4b5fd;display:flex;align-items:flex-start;gap:8px;animation:v17fadeIn 0.4s ease"><span style="font-size:14px;flex-shrink:0">🤖</span><span>' + text + '</span></div>';
}

// ============================================================
// v17 Level & Tab Switching
// ============================================================
function v16SwitchLevel(level) {
  v16CurrentLevel = level;
  v16CurrentTab = V16_TABS[level][0];
  document.querySelectorAll('.v16-sidebar-item[data-level]').forEach(el => {
    el.classList.toggle('active', el.dataset.level === level);
  });
  var header = document.querySelector('header.fixed');
  if (header) header.style.display = 'none';
  var leftPanel = document.querySelector('.fixed.top-20.left-4');
  if (leftPanel) leftPanel.style.display = 'none';
  var rightPanel = document.querySelector('.right-panel-container');
  if (rightPanel) rightPanel.style.display = 'none';
  var centerArea = document.getElementById('center-area');
  if (centerArea) centerArea.style.display = 'none';
  var v16Area = document.getElementById('v16ContentArea');
  if (v16Area) v16Area.style.display = '';
  var v16TabBar = document.getElementById('v16TabBar');
  if (v16TabBar) v16TabBar.style.display = '';
  v16RenderTabBar();
  v16RenderContent();
}

function v16RenderTabBar() {
  const bar = document.getElementById('v16TabBar');
  if (!bar) return;
  const tabs = V16_TABS[v16CurrentLevel];
  bar.innerHTML = tabs.map(t => {
    const active = t === v16CurrentTab ? 'active' : '';
    const iconMap = {
      'Dashboard':'📊','Pipeline':'🏭','Analytics':'📈','AI Brief':'🤖',
      'AI Advisor':'🤖','AI Daily':'🤖','AI Copilot':'🧠',
      'Overview':'📊','Projects':'📋','Team':'👥','AI Suggestions':'🤖',
      'My Work':'📋','Tasks':'✅','Workflow':'🔄','Documents':'📁'
    };
    return '<button class="v16-tab-item ' + active + '" onclick="v16SwitchTab(\'' + t + '\')">' + (iconMap[t]||'') + ' ' + t + '</button>';
  }).join('');
}

function v16SwitchTab(name) {
  v16CurrentTab = name;
  v16RenderTabBar();
  v16RenderContent();
}

// ============================================================
// v17 Content Renderer
// ============================================================
function v16RenderContent() {
  const area = document.getElementById('v16ContentArea');
  if (!area) return;
  const existingViews = ['overview-view','today-view','my-dashboard-view','data-import-view','taskboard-view','dashboard-view','gantt-view','nodeflow-view'];
  existingViews.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hidden'); });
  const key = v16CurrentLevel + '-' + v16CurrentTab;
  const renderers = {
    'L1-Dashboard': v16RenderL1Dashboard,
    'L1-Pipeline': v16RenderL1Pipeline,
    'L1-Analytics': v16RenderL1Analytics,
    'L1-AI Brief': v16RenderL1AIBrief,
    'L2-Overview': v16RenderL2Overview,
    'L2-Projects': v16RenderL2Projects,
    'L2-Team': v16RenderL2Team,
    'L2-AI Advisor': v16RenderL2AIAdvisor,
    'L3-My Work': v16RenderL3MyWork,
    'L3-AI Daily': v16RenderL3AIDaily,
    'L4-Overview': v16RenderL4Overview,
    'L4-Tasks': v16RenderL4Tasks,
    'L4-AI Copilot': v16RenderL4AICopilot,
    'L4-Workflow': v16RenderL4Workflow,
    'L4-Document': v16RenderL4Document,
    'L4-Team': v16RenderL4Team,
    'LD-Documents': v16RenderL4Document
  };
  const fn = renderers[key];
  if (fn) {
    area.innerHTML = '';
    area.style.display = '';
    fn(area);
    area.classList.remove('v16-fade-in');
    void area.offsetWidth;
    area.classList.add('v16-fade-in');
    requestAnimationFrame(() => { v16AnimateCountUps(); v16AnimateBars(); });
  }
}

// ============================================================
// Animation Helpers
// ============================================================
function v16AnimateCountUps() {
  document.querySelectorAll('[data-v16-count]').forEach(el => {
    const target = parseFloat(el.dataset.v16Count);
    const isFloat = el.dataset.v16Float === '1';
    const suffix = el.dataset.v16Suffix || '';
    const duration = 1200;
    const start = performance.now();
    function tick(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const val = target * eased;
      el.textContent = (isFloat ? val.toFixed(1) : Math.round(val).toLocaleString()) + suffix;
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
function v16AnimateBars() {
  document.querySelectorAll('[data-v16-bar-width]').forEach(el => {
    const w = el.dataset.v16BarWidth;
    requestAnimationFrame(() => { el.style.width = w; });
  });
}

// ============================================================
// SVG Helpers
// ============================================================
function v16CreateProgressRing(size, pct, color) {
  const r = (size - 12) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">' +
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>' +
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" stroke-linecap="round" transform="rotate(-90 '+(size/2)+' '+(size/2)+')" style="transition:stroke-dashoffset 1.2s cubic-bezier(0.22,1,0.36,1)"/>' +
    '<text x="'+(size/2)+'" y="'+(size/2+6)+'" text-anchor="middle" fill="'+color+'" font-size="20" font-weight="700">'+pct+'%</text></svg>';
}

function v16CreateDonutSVG(size, segments) {
  var total = segments.reduce(function(s,seg){return s+seg.value;},0);
  var cx=size/2, cy=size/2, r=size/2-30;
  var c = 2*Math.PI*r;
  var offset = 0;
  var arcs = '';
  var legend = '';
  segments.forEach(function(seg){
    var pct = seg.value/total;
    var dashLen = pct * c;
    var gapLen = c - dashLen;
    arcs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="24" stroke-dasharray="'+dashLen+' '+gapLen+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')" style="transition:all 0.8s ease"/>';
    offset += dashLen;
    legend += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="width:10px;height:10px;border-radius:2px;background:'+seg.color+';flex-shrink:0"></span><span style="font-size:12px;color:#cbd5e1">'+seg.label+'</span><span style="font-size:12px;font-weight:600;color:#fff;margin-left:auto">'+seg.value+'</span></div>';
  });
  return '<div style="display:flex;align-items:center"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+arcs+
    '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">'+total+'</text>'+
    '<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" fill="#64748b" font-size="11">Total</text></svg>' +
    '<div style="margin-left:16px">'+legend+'</div></div>';
}

// ============================================================
// Toast
// ============================================================
function v16ShowToast(msg, color) {
  var existing = document.getElementById('v17Toast');
  if (existing) existing.remove();
  var toast = document.createElement('div');
  toast.id = 'v17Toast';
  var bg = color || 'rgba(0,204,102,0.15)';
  var fg = color ? '#fff' : '#00CC66';
  var border = color || 'rgba(0,204,102,0.3)';
  toast.style.cssText = 'position:fixed;bottom:80px;right:24px;background:'+bg+';border:1px solid '+border+';border-radius:8px;padding:10px 18px;color:'+fg+';font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.3);transition:opacity 0.5s';
  toast.innerHTML = msg || '✓ Saved';
  document.body.appendChild(toast);
  setTimeout(function(){toast.style.opacity='0';},1200);
  setTimeout(function(){if(toast.parentNode)toast.remove();},1700);
}

// ============================================================
// L1-DASHBOARD (Company Level — scaled to ~2200 projects)
// ============================================================
function v16RenderL1Dashboard(area) {
  var token = localStorage.getItem('auth_token') || '';
  var headers = token ? {'Authorization': 'Bearer ' + token} : {};
  fetch('/api/projects', {headers: headers})
    .then(function(r) { return r.json(); })
    .then(function(projects) {
      var total = projects.length;
      var delayed = projects.filter(function(p){return p.risk_flag==='Critical';}).length;
      var atRisk = projects.filter(function(p){return p.risk_flag==='High';}).length;
      var blocked = projects.filter(function(p){return p.blocked_department;}).length;
      var onTrack = Math.max(0, total - delayed - atRisk);
      var healthScore = total > 0 ? (3 + (onTrack / total) * 2).toFixed(1) : '0.0';
      if (parseFloat(healthScore) > 5) healthScore = '5.0';
      var deptCounts = {};
      projects.forEach(function(p){ if(p.blocked_department) deptCounts[p.blocked_department] = (deptCounts[p.blocked_department]||0)+1; });
      var deptRiskMap = {};
      projects.forEach(function(p){ var d = p.department||'Other'; if(!deptRiskMap[d]) deptRiskMap[d]={total:0,risk:0}; deptRiskMap[d].total++; if(p.risk_flag==='Critical'||p.risk_flag==='High') deptRiskMap[d].risk++; });
      var bottlenecks = Object.keys(deptCounts).map(function(k){return {dept:k,count:deptCounts[k],pct:blocked>0?Math.round(deptCounts[k]/blocked*100):0,color:deptCounts[k]>5?'#FF4444':deptCounts[k]>2?'#FFAA00':'#FFAA00'};}).sort(function(a,b){return b.count-a.count;});
      if(bottlenecks.length===0) bottlenecks=[{dept:'None',count:0,pct:0,color:'#00CC66'}];
      var healthStars = Math.round(parseFloat(healthScore));
      var starsHtml = '';
      for (var s = 0; s < 5; s++) starsHtml += s < healthStars ? '<span style="color:#fbbf24">★</span>' : '<span style="color:#334155">☆</span>';
      var maxBn = bottlenecks[0].count || 1;
      var riskOrder = {'Critical':0,'High':1,'Medium':2,'Low':3,'None':4};
      projects.sort(function(a,b) { return (riskOrder[a.risk_flag]||5) - (riskOrder[b.risk_flag]||5); });
      var donutSegs=[{label:'On Track',value:onTrack,color:'#00CC66'},{label:'At Risk',value:atRisk,color:'#FFAA00'},{label:'Delayed',value:delayed,color:'#FF4444'}];
      var donutHtml=v16CreateDonutSVG(160,donutSegs);
      // Needs decision
      var needsDecision = projects.filter(function(p){return p.notes && p.notes.indexOf('DECISION REQUIRED')>=0;});
      var decisionHtml = needsDecision.slice(0,5).map(function(p){
        return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03)"><span style="width:8px;height:8px;border-radius:50%;background:#FFAA00;flex-shrink:0;animation:v17pulse 2s infinite"></span><span style="font-size:12px;color:#fff;flex:1">'+p.name+'</span><span style="font-size:10px;color:#FFAA00">'+(p.notes||'').replace('DECISION REQUIRED: ','')+'</span></div>';
      }).join('');
      // 7-day trend
      var trendData = [18, 19, 20, 19, 21, 22, 22];
      var trendMax = Math.max.apply(null, trendData);
      var trendMin = Math.min.apply(null, trendData);
      var trendRange = trendMax - trendMin || 1;
      var trendW = 200, trendH = 40;
      var trendPts = trendData.map(function(v,i){return (i/(trendData.length-1))*trendW+','+(trendH-((v-trendMin)/trendRange)*(trendH-4)-2);}).join(' ');
      var trendSvg = '<svg width="'+trendW+'" height="'+trendH+'" viewBox="0 0 '+trendW+' '+trendH+'"><polyline points="'+trendPts+'" fill="none" stroke="#FF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+trendW+'" cy="'+(trendH-((trendData[trendData.length-1]-trendMin)/trendRange)*(trendH-4)-2)+'" r="3" fill="#FF4444"/></svg>';
      var bnHtml=bottlenecks.slice(0,6).map(function(bn){return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="font-size:12px;color:#cbd5e1;width:100px">'+bn.dept+'</span><div style="flex:1;height:8px;background:rgba(255,255,255,0.04);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+(bn.count/maxBn*100).toFixed(1)+'%;background:'+bn.color+';border-radius:4px"></div></div><span style="font-size:12px;font-weight:600;color:'+bn.color+';min-width:60px;text-align:right">'+bn.count+' ('+bn.pct+'%)</span></div>';}).join('');
      var criticalProjects = projects.filter(function(p){return p.risk_flag==='Critical'||p.risk_flag==='High';});
      var tableRows=criticalProjects.slice(0,25).map(function(p,i){var riskColor=p.risk_flag==='Critical'?'#FF4444':p.risk_flag==='High'?'#FFAA00':'#00CC66';var progress=Math.round(p.progress||0);return '<div style="display:grid;grid-template-columns:32px 2fr 1fr 60px 1fr 1fr;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.03);cursor:pointer;font-size:12px" onclick="v16OpenProject('+p.id+')"><div style="color:#64748b">'+(i+1)+'</div><div style="color:#fff;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(p.name||'-')+'</div><div><span style="padding:2px 8px;border-radius:4px;background:rgba(96,165,250,0.1);color:#60a5fa;font-size:11px">'+(p.category||'-')+'</span></div><div><span style="padding:2px 6px;border-radius:4px;background:'+riskColor+'18;color:'+riskColor+';font-size:10px">'+(p.risk_flag||'None')+'</span></div><div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+progress+'%;background:'+riskColor+';border-radius:2px"></div></div><span style="font-size:10px;color:#64748b">'+progress+'%</span></div><div style="color:#94a3b8">'+(p.owner||'-')+'</div></div>';}).join('');
      var onTimeRate = total > 0 ? (onTrack/total*100).toFixed(1) : '0';

      area.innerHTML =
        // === RISK COMMAND BAR (NEW TOP SECTION) ===
        '<div style="background:linear-gradient(135deg,rgba(255,68,68,0.08),rgba(255,170,0,0.05));border:1px solid rgba(255,68,68,0.15);border-radius:12px;padding:16px 20px;margin-bottom:20px">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
            '<div style="display:flex;align-items:center;gap:12px"><span style="font-size:20px">⚠️</span><span style="font-size:16px;font-weight:700;color:#FF4444">Risk Command Center</span></div>' +
            '<div style="display:flex;gap:8px;align-items:center"><span style="font-size:11px;color:#94a3b8">7-Day At-Risk Trend</span>'+trendSvg+'</div>' +
          '</div>' +
          '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">' +
            '<div style="background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.2);border-radius:10px;padding:12px;text-align:center"><div style="font-size:28px;font-weight:700;color:#FF4444">'+delayed+'</div><div style="font-size:11px;color:#FF444499">Delayed / Critical</div></div>' +
            '<div style="background:rgba(255,170,0,0.1);border:1px solid rgba(255,170,0,0.2);border-radius:10px;padding:12px;text-align:center"><div style="font-size:28px;font-weight:700;color:#FFAA00">'+atRisk+'</div><div style="font-size:11px;color:#FFAA0099">At Risk</div></div>' +
            '<div style="background:rgba(255,170,0,0.1);border:1px solid rgba(255,170,0,0.2);border-radius:10px;padding:12px;text-align:center"><div style="font-size:28px;font-weight:700;color:#FFAA00">'+needsDecision.length+'</div><div style="font-size:11px;color:#FFAA0099">Needs Decision</div></div>' +
          '</div>' +
          (needsDecision.length>0 ? '<div style="margin-top:12px"><div style="font-size:12px;font-weight:600;color:#FFAA00;margin-bottom:8px">⚡ Decision Required</div>'+decisionHtml+'</div>' : '') +
          aiBubble(AI_HINTS.L1[0]) +
        '</div>' +

        // === STATUS OVERVIEW (KEPT FROM EXISTING) ===
        '<div class="v16-stat-cards">' +
          '<div class="v16-stat-card blue"><div class="v16-stat-number" data-v16-count="'+total+'">0</div><div class="v16-stat-label">Total Projects</div></div>' +
          '<div class="v16-stat-card green"><div class="v16-stat-number" data-v16-count="'+onTrack+'">0</div><div class="v16-stat-label">On Track</div></div>' +
          '<div class="v16-stat-card red"><div class="v16-stat-number" data-v16-count="'+delayed+'">0</div><div class="v16-stat-label">Delayed</div></div>' +
          '<div class="v16-stat-card purple"><div class="v16-stat-number" data-v16-count="'+atRisk+'">0</div><div class="v16-stat-label">At Risk</div></div>' +
        '</div>' +

        // === MIDDLE: Health + Metrics + Donut ===
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">' +
          '<div class="v16-card"><div class="v16-card-title">Portfolio Health</div>' +
            '<div style="display:flex;align-items:center;gap:16px">' +
              '<div>'+v16CreateProgressRing(90, Math.round(parseFloat(healthScore)/5*100), '#00CC66')+'</div>' +
              '<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#fff;margin-bottom:6px">Score: '+healthScore+'/5.0</div><div style="font-size:16px;margin-bottom:8px">'+starsHtml+'</div>' +
                '<div style="margin-bottom:8px"><span style="font-size:12px;color:#94a3b8">On Track Rate</span><div style="height:6px;background:rgba(255,255,255,0.06);border-radius:3px;margin-top:4px;overflow:hidden"><div style="height:100%;width:'+(onTrack/total*100).toFixed(1)+'%;background:#00CC66;border-radius:3px"></div></div></div>' +
                '<div><span style="font-size:12px;color:#94a3b8">Risk Rate</span><div style="height:6px;background:rgba(255,255,255,0.06);border-radius:3px;margin-top:4px;overflow:hidden"><div style="height:100%;width:'+((atRisk+blocked)/total*100).toFixed(1)+'%;background:#FFAA00;border-radius:3px"></div></div></div>' +
              '</div></div></div>' +
          '<div class="v16-card"><div class="v16-card-title">Status Distribution</div>'+donutHtml+'</div>' +
        '</div>' +

        // === BOTTOM: Department Risk Ranking + Critical Projects Table ===
        '<div style="display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start">' +
          '<div>' +
            '<div class="v16-card" style="margin-bottom:16px"><div class="v16-card-title">Department Risk Ranking</div>'+bnHtml+aiBubble(AI_HINTS.L1[1])+'</div>' +
            '<div style="background:rgba(255,255,255,0.02);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.05)">' +
              '<div style="display:grid;grid-template-columns:32px 2fr 1fr 60px 1fr 1fr;background:rgba(255,255,255,0.06);padding:10px 14px;font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.5px"><div>#</div><div>Project</div><div>Category</div><div>Risk</div><div>Progress</div><div>Owner</div></div>' +
              tableRows +
              (criticalProjects.length > 25 ? '<div style="text-align:center;padding:10px;font-size:11px;color:#64748b">Showing top 25 of '+criticalProjects.length+' at-risk projects</div>' : '') +
            '</div>' +
          '</div>' +
          '<div style="position:sticky;top:80px"><div class="v16-card" style="margin-bottom:12px"><div class="v16-card-title">Key Metrics</div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">' +
              '<div style="text-align:center;padding:10px;background:rgba(59,130,246,0.06);border-radius:8px"><div style="font-size:20px;font-weight:700;color:#60a5fa">14.2</div><div style="font-size:10px;color:#94a3b8">Avg Cycle (wk)</div></div>' +

// ============================================================
// L3-MY WORK (Priority-Driven Personal View)
// ============================================================
function v16RenderL3MyWork(area) {
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token}:{};
  var ownerName = window._v17L3Owner || 'L****';
  Promise.all([
    fetch('/api/projects',{headers:headers}).then(function(r){return r.json();}),
    fetch('/api/milestones',{headers:headers}).then(function(r){return r.json();}).catch(function(){return [];})
  ]).then(function(results){
    var projects=results[0];
    var milestones=results[1];
    // Filter to user's projects
    var myProjects=projects.filter(function(p){return p.owner && p.owner.toLowerCase().indexOf(ownerName.toLowerCase())>=0;});
    if(myProjects.length===0) myProjects=projects.slice(0,15);
    // Get user's tasks
    var myTasks=[];
    var now=new Date();
    milestones.forEach(function(m){
      if(m.status==='Completed') return;
      var proj=projects.find(function(p){return p.id===m.project_id;});
      var isMine=myProjects.some(function(p){return p.id===m.project_id;});
      if(!isMine) return;
      var daysUntil=null;
      var overdue=false;
      var dueToday=false;
      if(m.due_date){
        try{var due=new Date(m.due_date);daysUntil=Math.ceil((due-now)/(1000*60*60*24));if(daysUntil<0&&m.status!=='Completed')overdue=true;if(daysUntil===0)dueToday=true;}catch(e){}
      }
      var priority=m.manual_priority||(proj&&proj.priority)||'P3';
      myTasks.push({id:m.id,name:m.name,project:proj?proj.name:'Unknown',projectId:m.project_id,phase:m.phase,due:m.due_date,status:m.status,owner:m.owner,priority:priority,daysUntil:daysUntil,overdue:overdue,dueToday:dueToday,dept:proj?proj.department:'Unknown'});
    });
    // Sort by urgency
    myTasks.sort(function(a,b){
      var pOrder={P0:0,P1:1,P2:2,P3:3};
      if(a.overdue&&!b.overdue) return -1;
      if(!a.overdue&&b.overdue) return 1;
      if(a.dueToday&&!b.dueToday) return -1;
      if(!a.dueToday&&b.dueToday) return 1;
      var pa=pOrder[a.priority]||9;
      var pb=pOrder[b.priority]||9;
      if(pa!==pb) return pa-pb;
      return (a.daysUntil||999)-(b.daysUntil||999);
    });
    // Group tasks
    var p0overdue=myTasks.filter(function(t){return t.priority==='P0'&&t.overdue;});
    var p0today=myTasks.filter(function(t){return t.priority==='P0'&&t.dueToday;});
    var p1week=myTasks.filter(function(t){return t.priority==='P1'&&!t.overdue&&t.daysUntil!==null&&t.daysUntil<=7;});
    var p2upcoming=myTasks.filter(function(t){return t.priority==='P2'&&t.daysUntil!==null&&t.daysUntil>0;});
    var completed=[];

    // Today's Focus (top 3-5 most urgent)
    var focusTasks=myTasks.filter(function(t){return t.overdue||t.dueToday||t.priority==='P0'||t.priority==='P1';}).slice(0,5);

    var focusHtml=focusTasks.length>0?
      focusTasks.map(function(t){
        var pColor=t.priority==='P0'?'#FF4444':t.priority==='P1'?'#FFAA00':t.priority==='P2'?'#3b82f6':'#888888';
        var countdown='';
        if(t.overdue) countdown='<span style="background:rgba(255,68,68,0.15);color:#FF4444;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">OVERDUE by '+Math.abs(t.daysUntil)+' days</span>';
        else if(t.dueToday) countdown='<span style="background:rgba(255,170,0,0.15);color:#FFAA00;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">Due TODAY</span>';
        else if(t.daysUntil!==null) countdown='<span style="background:rgba(59,130,246,0.1);color:#60a5fa;padding:2px 8px;border-radius:4px;font-size:11px">'+t.daysUntil+' days left</span>';
        return '<div style="display:flex;align-items:center;gap:12px;padding:14px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:10px;border-left:4px solid '+pColor+';margin-bottom:8px"><div style="flex:1"><div style="font-size:14px;font-weight:600;color:#fff">'+t.name+'</div><div style="font-size:11px;color:#64748b;margin-top:2px">'+t.project+' · '+t.dept+' · '+t.due+'</div></div><div>'+countdown+'</div><span style="font-size:10px;padding:2px 8px;border-radius:4px;background:'+pColor+'18;color:'+pColor+';font-weight:600">'+t.priority+'</span></div>';
      }).join('')
      :'<div style="text-align:center;padding:40px;background:rgba(0,204,102,0.05);border-radius:12px"><div style="font-size:32px;margin-bottom:8px">👍</div><div style="font-size:16px;font-weight:600;color:#00CC66">Today: All clear!</div><div style="font-size:12px;color:#64748b">No urgent tasks for today</div></div>';

    function priorityGroup(title,tasks,icon,expanded){
      if(tasks.length===0) return '';
      return '<div style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 0" onclick="var b=this.nextElementSibling;b.style.display=b.style.display===\'none\'?\'\':\'none\'"><span>'+icon+'</span><span style="font-size:14px;font-weight:600;color:#fff">'+title+' ('+tasks.length+')</span><span style="font-size:10px;color:#64748b">▼</span></div><div style="'+(expanded?'':'display:none')+'">'+tasks.map(function(t){
        var pColor=t.priority==='P0'?'#FF4444':t.priority==='P1'?'#FFAA00':t.priority==='P2'?'#3b82f6':'#888888';
        return '<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.03)"><span style="width:8px;height:8px;border-radius:50%;background:'+pColor+';flex-shrink:0"></span><div style="flex:1;cursor:pointer" onclick="v16OpenProject('+t.projectId+')"><div style="font-size:12px;color:#e2e8f0">'+t.name+'</div><div style="font-size:10px;color:#64748b">'+t.project+' · '+t.dept+' · '+t.due+'</div></div><span style="font-size:9px;padding:2px 6px;border-radius:4px;background:'+pColor+'18;color:'+pColor+'">'+t.priority+'</span><div style="display:flex;gap:4px;align-items:center"><input type="date" value="'+(t.due||'')+'" onchange="v17L3UpdateTask('+t.projectId+','+t.id+',\'due_date\',this.value)" style="background:rgba(255,255,255,0.03);color:#94a3b8;border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:1px 3px;font-size:9px;width:80px;cursor:pointer;outline:none"><button onclick="v17L3CycleStatus('+t.projectId+','+t.id+')" style="padding:2px 6px;border-radius:4px;font-size:9px;font-weight:600;cursor:pointer;background:rgba(59,130,246,0.1);color:#60a5fa;border:1px solid rgba(59,130,246,0.2)">'+t.status+'</button><button onclick="v17L3DeleteTask('+t.projectId+','+t.id+')" style="background:none;border:none;color:#64748b;font-size:10px;cursor:pointer;padding:2px" title="Delete">✕</button></div></div>';
      }).join('')+'</div></div>';
    }

    // My Projects sidebar
    var projSidebar=myProjects.slice(0,15).map(function(p){var rc=p.risk_flag==='Critical'?'#FF4444':p.risk_flag==='High'?'#FFAA00':'#00CC66';var prog=Math.round(p.progress||0);return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);cursor:pointer" onclick="v16OpenProject('+p.id+')"><span style="width:8px;height:8px;border-radius:50%;background:'+rc+';flex-shrink:0"></span><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.name+'</div><div style="display:flex;align-items:center;gap:6px;margin-top:2px"><div style="flex:1;height:3px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+prog+'%;background:'+rc+';border-radius:2px"></div></div><span style="font-size:9px;color:#64748b">'+prog+'%</span></div></div></div>';}).join('');

    area.innerHTML=
      '<div style="display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:start">' +
        '<div>' +
          // TODAY'S FOCUS
          '<div style="margin-bottom:20px"><div style="font-size:18px;font-weight:700;color:#fff;margin-bottom:4px">Today\'s Focus</div><div style="font-size:12px;color:#64748b;margin-bottom:12px">Your most urgent items — focus here first</div>'+focusHtml+aiBubble(AI_HINTS.L3[0])+'</div>' +
          // PRIORITY GROUPS
          priorityGroup('P0 — Overdue',p0overdue,'🔴',true)+
          priorityGroup('P0 — Due Today',p0today,'🟠',true)+
          priorityGroup('P1 — This Week',p1week,'🟡',false)+
          priorityGroup('P2 — Upcoming',p2upcoming,'🔵',false)+
          priorityGroup('Completed This Week',completed,'⚪',false)+
        '</div>' +
        // MY PROJECTS SIDEBAR
        '<div style="position:sticky;top:80px"><div class="v16-card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><span style="font-size:14px;font-weight:600;color:#fff">My Projects ('+myProjects.length+')</span><button onclick="v17L3AddTask()" style="padding:3px 10px;border-radius:6px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);color:#60a5fa;font-size:11px;font-weight:600;cursor:pointer">+ Add Task</button></div>'+projSidebar+'</div></div>' +
      '</div>';
  }).catch(function(err){area.innerHTML='<div style="color:#FF4444;padding:40px">Failed: '+err.message+'</div>';});
}

      departments.forEach(function(d,i){

        wheelSvg+='<circle cx="'+nx+'" cy="'+ny+'" r="'+nodeR+'" fill="rgba(15,23,42,0.9)" stroke="'+statusColor+'" stroke-width="2" style="cursor:pointer" onclick="v16ShowDeptDetail(\''+d.id+'\')"/>';

      var selectorHtml='<select id="v16ProjectSelector" onchange="v17SwitchL4Project(this.value)" style="background:rgba(255,255,255,0.05);color:#fff;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:4px 12px;font-size:12px;outline:none;cursor:pointer">';
      projects.filter(function(p){return p.priority==='P0'||p.name==='XT-500';}).slice(0,10).forEach(function(p){

// L4-TASKS (with Blocked column + operational features)

function v16RenderL4Tasks(area) {
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token}:{};
  fetch('/api/projects',{headers:headers}).then(function(r){return r.json();}).then(function(projects){

      var inProgress=tasks.filter(function(t){return t.status==='In Progress';});
      var blocked=tasks.filter(function(t){return t.status==='Blocked';});
      var completed=tasks.filter(function(t){return t.status==='Completed';});

      function taskCard(t,columnType){
        var pColor=t.manual_priority==='P0'?'#FF4444':t.manual_priority==='P1'?'#FFAA00':t.manual_priority==='P2'?'#3b82f6':'#888888';
        var dueDate=t.due_date||'';
        var html='<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid '+pColor+'">';

        html+='<span style="font-size:12px;font-weight:500;color:#fff;flex:1;cursor:pointer" onclick="v17EditTaskName('+t.id+',this)">'+t.name+'</span>';
        html+='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:'+pColor+'18;color:'+pColor+'">'+(t.manual_priority||'P3')+'</span>';
        html+='<button onclick="v17DeleteTask('+proj.id+','+t.id+')" style="margin-left:4px;background:none;border:none;color:#64748b;font-size:10px;cursor:pointer;padding:2px">✕</button>';
        html+='</div>';
        html+='<div style="font-size:10px;color:#64748b;margin-bottom:4px">'+(t.owner||'Unassigned')+' · '+(t.phase||'')+'</div>';
        html+='<div style="display:flex;align-items:center;gap:6px">';
        html+='<input type="date" value="'+dueDate+'" onchange="v17UpdateTask('+proj.id+','+t.id+',\'due_date\',this.value)" style="background:rgba(255,255,255,0.03);color:#94a3b8;border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:2px 4px;font-size:9px;width:90px;cursor:pointer;outline:none">';
        html+='<button onclick="v17CycleTaskStatus('+proj.id+','+t.id+')" style="padding:2px 8px;border-radius:4px;font-size:9px;font-weight:600;cursor:pointer;background:rgba(59,130,246,0.1);color:#60a5fa;border:1px solid rgba(59,130,246,0.2)">'+t.status+'</button>';
        html+='</div>';

          html+='<div style="font-size:10px;color:#FF4444;margin-top:4px">⏳ Blocked</div>';
        }
        html+='</div>';
        return html;
      }

      function column(title,icon,tasks,type,bgColor){
        var headerBg=type==='blocked'?'rgba(255,68,68,0.08)':type==='completed'?'rgba(0,204,102,0.05)':'rgba(255,255,255,0.02)';
        return '<div style="flex:1;min-width:220px"><div style="background:'+headerBg+';border:1px solid rgba(255,255,255,0.06);border-radius:10px;overflow:hidden"><div style="padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.05)"><div style="display:flex;align-items:center;gap:6px"><span>'+icon+'</span><span style="font-size:13px;font-weight:600;color:#fff">'+title+'</span><span style="font-size:11px;color:#64748b">('+tasks.length+')</span></div><button onclick="v17AddTask('+proj.id+',\''+type+'\')" style="width:22px;height:22px;border-radius:4px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);color:#60a5fa;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button></div><div style="padding:8px;max-height:500px;overflow-y:auto">'+tasks.map(function(t){return taskCard(t,type);}).join('')+'</div></div></div>';
      }

      area.innerHTML=
        '<div style="margin-bottom:16px"><h3 style="font-size:18px;font-weight:700;color:#fff;margin:0 0 4px">Task Board</h3><p style="font-size:13px;color:#7a8fa3;margin:0">'+proj.name+' — '+tasks.length+' tasks'+aiBubble(AI_HINTS.L4[2])+'</p></div>' +
        '<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px">' +
        column('Not Started','⬜',notStarted,'not_started') +
        column('In Progress','🔵',inProgress,'in_progress') +

        column('Complete','✅',completed,'completed') +
        '</div>';
    }).catch(function(err){area.innerHTML='<div style="color:#FF4444;padding:40px">Failed: '+err.message+'</div>';});
  }).catch(function(err){area.innerHTML='<div style="color:#FF4444;padding:40px">Failed: '+err.message+'</div>';});

// Task operations
function v17CycleTaskStatus(projectId,taskId){
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'};
  var cycle={'Not Started':'In Progress','In Progress':'Blocked','Blocked':'Completed','Completed':'Not Started'};
  fetch('/api/milestones?project_id='+projectId,{headers:headers}).then(function(r){return r.json();}).then(function(tasks){
    var t=tasks.find(function(x){return x.id===taskId;});
    if(!t)return;
    var newStatus=cycle[t.status]||'Not Started';
    fetch('/api/projects/'+projectId+'/tasks/'+taskId,{method:'PUT',headers:headers,body:JSON.stringify({status:newStatus})}).then(function(r){return r.json();}).then(function(){
      v16ShowToast('✓ Status updated to '+newStatus);
      v16RenderL4Tasks(document.getElementById('v16ContentArea'));
    });
  });
}

function v17UpdateTask(projectId,taskId,field,value){
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'};
  var body={};body[field]=value;
  fetch('/api/projects/'+projectId+'/tasks/'+taskId,{method:'PUT',headers:headers,body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(){
    v16ShowToast('✓ '+field+' updated');
    v16RenderL4Tasks(document.getElementById('v16ContentArea'));
  });
}

function v17EditTaskName(projectId,taskId,el){
  var newName=prompt('Edit task name:',el.textContent);
  if(!newName||newName===el.textContent)return;
  v17UpdateTask(projectId,taskId,'name',newName);
}

function v17DeleteTask(projectId,taskId){
  if(!confirm('Delete this task?'))return;
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token}:{};
  fetch('/api/projects/'+projectId+'/tasks/'+taskId,{method:'DELETE',headers:headers}).then(function(){
    v16ShowToast('✓ Task deleted');
    v16RenderL4Tasks(document.getElementById('v16ContentArea'));
  });
}

function v17AddTask(projectId,type){
  var name=prompt('New task name:');
  if(!name)return;
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'};
  var statusMap={'not_started':'Not Started','in_progress':'In Progress','blocked':'Blocked','completed':'Completed'};
  fetch('/api/projects/'+projectId+'/tasks',{method:'POST',headers:headers,body:JSON.stringify({name:name,project_id:projectId,manual_priority:'P2',due_date:null})}).then(function(r){return r.json();}).then(function(){
    v16ShowToast('✓ Task added');
    v16RenderL4Tasks(document.getElementById('v16ContentArea'));
  });
}

// L4-AI COPILOT (Project-level AI analysis)

function v16RenderL4AICopilot(area) {
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token}:{};
  fetch('/api/projects',{headers:headers}).then(function(r){return r.json();}).then(function(projects){

        var progress=Math.round(proj.progress||0);
        var daysLeft=proj.end_date?Math.ceil((new Date(proj.end_date)-new Date())/(1000*60*60*24)):'--';

        // === CRITICAL PATH ANALYSIS ===
        var criticalSteps=[
          {step:'PCB Layout Approval',dept:'EE',status:blockers.find(function(b){return b.owner==='EE';})?'blocked':'pending',days:blockers.find(function(b){return b.owner==='EE';})?(blockers.find(function(b){return b.owner==='EE';}).days):0,downstream:2},
          {step:'Material Sample',dept:'SC',status:blockers.find(function(b){return b.owner==='SC';})?'blocked':'pending',days:blockers.find(function(b){return b.owner==='SC';})?(blockers.find(function(b){return b.owner==='SC';}).days):0,downstream:1},
          {step:'Color Code Confirmation',dept:'CMF',status:blockers.find(function(b){return b.owner==='CMF';})?'blocked':'pending',days:blockers.find(function(b){return b.owner==='CMF';})?(blockers.find(function(b){return b.owner==='CMF';}).days):0,downstream:1},
          {step:'EB0 Gate',dept:'PMO',status:'upcoming',days:0,downstream:3},
          {step:'DQTP Complete',dept:'DQTP',status:'upcoming',days:0,downstream:2},
          {step:'EB1 Gate',dept:'PMO',status:'upcoming',days:0,downstream:1},
          {step:'Pilot Run',dept:'MFG',status:'upcoming',days:0,downstream:1},
          {step:'MP Release',dept:'PMO',status:'upcoming',days:0,downstream:0},
        ];
        var cpHtml=criticalSteps.map(function(s,i){
          var sColor=s.status==='blocked'?'#FF4444':s.status==='pending'?'#FFAA00':'#64748b';
          var sIcon=s.status==='blocked'?'🚫':s.status==='pending'?'⏳':'⬜';
          var bar='<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:8px;margin-bottom:6px;border-left:3px solid '+sColor+'">'+
            '<div style="width:24px;text-align:center;font-size:14px">'+sIcon+'</div>'+
            '<div style="flex:1"><div style="font-size:13px;font-weight:500;color:#fff">'+s.step+'</div><div style="font-size:10px;color:#94a3b8">'+s.dept+(s.downstream>0?' · blocks '+s.downstream+' downstream':'')+'</div></div>'+
            (s.status==='blocked'?'<div style="padding:2px 10px;border-radius:4px;background:rgba(255,68,68,0.15);color:#FF4444;font-size:11px;font-weight:600;animation:v17pulse 2s infinite">'+s.days+'d blocked</div>':s.status==='pending'?'<div style="padding:2px 10px;border-radius:4px;background:rgba(255,170,0,0.1);color:#FFAA00;font-size:11px">Pending</div>':'<div style="padding:2px 10px;border-radius:4px;background:rgba(100,116,139,0.1);color:#64748b;font-size:11px">Upcoming</div>')+
            '</div>';
          if(i<criticalSteps.length-1) bar+='<div style="margin-left:26px;width:2px;height:12px;background:rgba(255,255,255,0.06)"></div>';
          return bar;
        }).join('');

        // === RISK SCAN ===
        var riskFactors=[];
        if(blockers.length>0) riskFactors.push({level:'critical',label:blockers.length+' Active Blockers',detail:'Longest: '+Math.max.apply(null,blockers.map(function(b){return b.days||0;}))+' days',action:'Escalate blockers to VP level'});
        if(proj.risk_flag==='Critical') riskFactors.push({level:'critical',label:'Project Flagged Critical',detail:'Risk to MP date',action:'Schedule emergency review'});
        if(daysLeft!=='--'&&daysLeft<30) riskFactors.push({level:'high',label:'Timeline Pressure',detail:daysLeft+' days to deadline',action:'Fast-track critical items'});
        if(milestones.filter(function(m){return m.status==='Blocked';}).length>0) riskFactors.push({level:'high',label:'Tasks in Blocked State',detail:milestones.filter(function(m){return m.status==='Blocked';}).length+' tasks blocked',action:'Clear blockers to resume flow'});

        var riskColors={critical:'#FF4444',high:'#FFAA00',warning:'#fbbf24',info:'#3b82f6'};

        var optimalSteps=[
          {order:1,action:'Escalate PCB layout to EE VP',impact:'Unblock 2 tasks, save 3 days',effort:'Low',timeSave:'3 days'},
          {order:2,action:'Parallel-track DQTP test prep',impact:'Avoid EB0→DQTP serial delay',effort:'Medium',timeSave:'5 days'},
          {order:3,action:'Pre-approve material alternates',impact:'Reduce SC single-source risk',effort:'Medium',timeSave:'2 days'},
          {order:4,action:'Schedule compliance pre-review',impact:'Catch issues before EB1 gate',effort:'Low',timeSave:'4 days'},
        ];
        var totalSave=optimalSteps.reduce(function(s,o){return s+parseInt(o.timeSave);},0);

function v16ShowDeptDetail(deptId) {
  var departments=[
    {id:'PMO',name:'PMO',icon:'📋',fullName:'CN NPI / US PMO',h:8,a:7},
    {id:'PD',name:'PD',icon:'📐',fullName:'US Product Design',h:6,a:4},

    {id:'ID',name:'ID',icon:'🎨',fullName:'US Industrial Design',h:4,a:2},
    {id:'EE',name:'EE',icon:'⚡',fullName:'US/CN Electrical Engineering',h:7,a:6},
    {id:'CMF',name:'CMF',icon:'🖌️',fullName:'CN Artwork & CMF',h:5,a:3},
    {id:'DQTP',name:'DQTP',icon:'🔬',fullName:'CN DQTP Lab',h:6,a:5},
    {id:'SC',name:'SC',icon:'📦',fullName:'CN Supply Chain',h:8,a:7},
    {id:'Quality',name:'QA',icon:'✅',fullName:'CN/US Quality Assurance',h:4,a:2},
    {id:'Compliance',name:'Comp',icon:'📋',fullName:'CN Compliance',h:3,a:2},
    {id:'MFG',name:'MFG',icon:'🏭',fullName:'Factory Manufacturing',h:6,a:4},
    {id:'Marketing',name:'MKT',icon:'📢',fullName:'US Creative / UK Marketing',h:4,a:1}
  ];
  var dept=departments.find(function(d){return d.id===deptId;});
  if(!dept)return;
  var tasks=typeof sl500LoadTasks==='function'?sl500LoadTasks():[];
  var ownerToDept={'CN NPI':'PMO','US PMO':'PMO','US PD':'PD','US ID':'ID','US Eng':'EE','CN Artwork':'CMF','CN CMF':'CMF','CN EE':'EE','US EE':'EE','CN DQTP':'DQTP','CN Quality':'Quality','US Quality':'Quality','CN SC':'SC','CN Compliance':'Compliance','Factory':'MFG','US Creative':'Marketing','UK Marketing':'Marketing'};
  var deptTasks=tasks.filter(function(t){return (ownerToDept[t.owner]||'PMO')===deptId;});
  var completed=0,overdue=0,active=0;
  deptTasks.forEach(function(t){var ls=typeof sl500ComputeLiveStatus==='function'?sl500ComputeLiveStatus(t):'not_started';if(ls==='completed')completed++;else if(ls==='overdue')overdue++;else if(ls==='in_progress')active++;});
  var panel=document.getElementById('v16DeptDetailPanel');
  if(!panel)return;
  var pct=deptTasks.length>0?Math.round(completed/deptTasks.length*100):0;

// ============================================================
// L3 Task CRUD Operations
// ============================================================
function v17L3CycleStatus(projectId,taskId){
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'};
  var cycle={'Not Started':'In Progress','In Progress':'Blocked','Blocked':'Completed','Completed':'Not Started'};
  fetch('/api/milestones?project_id='+projectId,{headers:headers}).then(function(r){return r.json();}).then(function(tasks){
    var t=tasks.find(function(x){return x.id===taskId;});
    if(!t)return;
    var newStatus=cycle[t.status]||'Not Started';
    fetch('/api/projects/'+projectId+'/tasks/'+taskId,{method:'PUT',headers:headers,body:JSON.stringify({status:newStatus})}).then(function(r){return r.json();}).then(function(){
      v16ShowToast('✓ Status → '+newStatus);
      v16RenderL3MyWork(document.getElementById('v16ContentArea'));
    });
  });
}

function v17L3UpdateTask(projectId,taskId,field,value){
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'};
  var body={};body[field]=value;
  fetch('/api/projects/'+projectId+'/tasks/'+taskId,{method:'PUT',headers:headers,body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(){
    v16ShowToast('✓ '+field+' updated');
    v16RenderL3MyWork(document.getElementById('v16ContentArea'));
  });
}

function v17L3DeleteTask(projectId,taskId){
  if(!confirm('Delete this task?'))return;
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token}:{};
  fetch('/api/projects/'+projectId+'/tasks/'+taskId,{method:'DELETE',headers:headers}).then(function(){
    v16ShowToast('✓ Task deleted');
    v16RenderL3MyWork(document.getElementById('v16ContentArea'));
  });
}

function v17L3AddTask(){
  var name=prompt('New task name:');
  if(!name)return;
  var proj=window._v17L4Project;
  if(!proj){
    // Use first project from My Projects
    var token=localStorage.getItem('auth_token')||'';
    var headers=token?{'Authorization':'Bearer '+token}:{};
    fetch('/api/projects',{headers:headers}).then(function(r){return r.json();}).then(function(projects){
      var ownerName=window._v17L3Owner||'L****';
      var myProj=projects.find(function(p){return p.owner&&p.owner.toLowerCase().indexOf(ownerName.toLowerCase())>=0;})||projects[0];
      if(myProj) v17L3CreateTask(myProj.id,name);
    });
    return;
  }
  v17L3CreateTask(proj.id,name);
}

function v17L3CreateTask(projectId,name){
  var token=localStorage.getItem('auth_token')||'';
  var headers=token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'};
  fetch('/api/projects/'+projectId+'/tasks',{method:'POST',headers:headers,body:JSON.stringify({name:name,project_id:projectId,manual_priority:'P2',due_date:null})}).then(function(r){return r.json();}).then(function(){
    v16ShowToast('✓ Task added');
    v16RenderL3MyWork(document.getElementById('v16ContentArea'));
  });
}

  window._v17L4Project = {id: projectId};
  v16SwitchLevel('L4');
}

function v17AISendMessage() {
  var input=document.getElementById('v17AIInput');

  var msg=input.value.trim();
  input.value='';

  setTimeout(function(){
    var response=v17AIMatchResponse(msg);
    v17AIAddMessage('ai',response);
  },500);
}

function v17AIMatchResponse(msg) {
  var m=msg.toLowerCase();
  if(m.indexOf('risk')>=0||m.indexOf('delay')>=0) return 'Based on current data, the top 3 risks are:<br>1. SC bottleneck (22 projects blocked)<br>2. Compliance delays (avg 12 days vs 5 day benchmark)<br>3. PMO prioritization conflict (7 projects waiting)<br><br>Want me to draft an escalation email for the SC bottleneck?';
